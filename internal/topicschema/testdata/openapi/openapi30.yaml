# OpenAPI 3.0 schemas are not JSON Schema 2020-12 (nullable, boolean
# exclusiveMinimum), and 3.0 has no webhooks section: rejected.
openapi: 3.0.3
info:
  title: Legacy API
  version: 1.0.0
paths:
  /orders:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                total:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                note:
                  type: string
                  nullable: true
      responses:
        '200':
          description: OK

# A payload schema reaching a schema in another file: rejected, naming the
# topic and the pointer of the reference.
openapi: 3.1.0
info:
  title: Split document
  version: 1.0.0
webhooks:
  orderCreated:
    post:
      x-outpost-topic: order.created
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        customer:
          $ref: './schemas/customer.yaml#/Customer'

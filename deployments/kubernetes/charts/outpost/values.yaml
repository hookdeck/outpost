# Default values for Outpost.

outpost:
  imagePullSecrets: []
  image:
    repository: hookdeck/outpost
    tag: latest
    pullPolicy: IfNotPresent

  # Number of replicas for each service
  replicas:
    api: 1 # Default to 1, scale based on load
    delivery: 1 # Default to 1, scale based on queue size
    log: 1 # Default to 1, scale based on log volume

  # ServiceAccount to use for pods
  serviceAccountName: ""

  # Security contexts
  podSecurityContext: {}
  securityContext: {}

  # Container resources (optional)
  resources: {}

  # Extra labels added to pod templates
  podLabels: {}

  # Annotations added to pod templates
  podAnnotations: {}

  # Pod scheduling constraints
  nodeSelector: {}
  affinity: {}
  tolerations: []

  # Additional volumes and mounts
  extraVolumes: []
  extraVolumeMounts: []

  # Environment variables from Secrets/ConfigMaps
  envFrom: []
  # - secretRef:
  #     name: my-secret
  # - configMapRef:
  #     name: my-configmap

  service:
    type: ClusterIP
    port: 3333
    annotations: {}
    loadBalancerSourceRanges: []

  # Outpost YAML config
  config: {}
  # Topic schemas go in the same config. Only the API pods load them, at startup,
  # so a problem in them only stops the API pods.
  # config:
  #   topics:
  #     - order.created
  #   topics_schemas:
  #     order.created:
  #       description: "Fires when a new order is placed."
  #       validation: warn # off (default), warn or enforce
  #       payload_schema:
  #         type: object
  #         properties:
  #           total: { type: number }
  #   # Or load them from a file mounted with extraVolumes and extraVolumeMounts:
  #   # topics_schemas_file: /schemas/topics-schemas.yaml
  #   # Validation takes roughly 20-350x the data size in API pod memory:
  #   # topics_validation_max_bytes: 262144
  #
  # MCP Events: set mcp.enabled on a topic schema, in a deploy after every
  # service runs a release with MCP support. The config is shared by all pods.
  # Raise delivery_max_concurrency to at least 8 when MCP is on.
  # config:
  #   topics_schemas:
  #     order.created:
  #       mcp:
  #         enabled: true
  #       payload_schema:
  #         type: object
  #         properties:
  #           total: { type: number }
  #   mcp:
  #     server_url: "https://mcp.example.com/mcp"
  #     ttl_default: 1h
  #     retry_schedule: [30, 120, 600]
  #   max_mcp_subscriptions_per_tenant: 100
  #   max_mcp_subscriptions_per_principal: 20
  #   delivery_max_concurrency: 8

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    []
    # - host: outpost.local
    #   paths:
    #     - path: /
    #       pathType: Prefix
  tls:
    []
    # - secretName: outpost-tls
    #   hosts:
    #     - outpost.example.com

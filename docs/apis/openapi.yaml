  # MCP Events (API v2 only)
  /tenants/{tenant_id}/mcp/events:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
        description: The tenant the MCP request is for. The event list doesn't depend on the tenant, which doesn't need to exist.
    get:
      tags: [MCP]
      summary: List MCP Events
      x-outpost-deployment: self-hosted
      description: |
        Returns the `events/list` result for an MCP client: one entry per topic whose `mcp.enabled` is set, in `TOPICS` order. Return the body to the client unchanged. The protocol envelope, such as `resultType`, stays your MCP server's job.

        Pass `topics` to list only the events the principal may discover, after your own authorization check. Topics are instance configuration, so the result only changes when you deploy new topic schemas.

        A page holds up to `limit` events and about 1 MiB of JSON, and at least one event. `nextCursor` is present only when more pages remain. An invalid `cursor` or `limit` fails with `invalid_params`.

        API v2 only. Requires the Admin API Key.
      operationId: listMCPEvents
      security:
        - AdminApiKey: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: The `cursor` from the `events/list` request params, passed through unchanged.
        - name: topics
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: |
            The event names the principal may discover. Comma-separated (`topics=order.created,order.shipped`), repeated (`topics=order.created&topics=order.shipped`) or both. Names that aren't MCP-enabled topics are ignored.

            Present but empty (`topics=`) lists no events. Omit it to list every MCP-enabled topic.

            Generated SDK methods drop an empty array from the query string, which lists every MCP-enabled topic. For a principal allowed no topics, answer `{"events": []}` without calling this endpoint, or use the SDKs' MCP Events helpers, which do.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          description: Maximum number of events per page (1-100, default 100).
      responses:
        "200":
          description: The `events/list` result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPEventList"
              examples:
                LastPage:
                  summary: One page, no more pages
                  value:
                    events:
                      - name: "order.created"
                        description: "Fires when a new order is placed."
                        delivery: ["webhook"]
                        inputSchema:
                          type: object
                          properties:
                            total:
                              description: Order total in major units.
                              anyOf:
                                - type: number
                                - type: array
                                  items:
                                    type: number
                                  minItems: 1
                                  maxItems: 100
                                - type: object
                                  properties:
                                    $gt:
                                      type: number
                                    $gte:
                                      type: number
                                    $lt:
                                      type: number
                                    $lte:
                                      type: number
                                  additionalProperties: false
                                  minProperties: 1
                            currency:
                              description: ISO 4217 currency code.
                              anyOf:
                                - type: string
                                  maxLength: 256
                                - type: array
                                  items:
                                    type: string
                                    maxLength: 256
                                  minItems: 1
                                  maxItems: 100
                          additionalProperties: false
                        payloadSchema:
                          type: object
                          properties:
                            order_id:
                              type: string
                            total:
                              type: number
                              description: Order total in major units.
                            currency:
                              type: string
                              description: ISO 4217 currency code.
                            created_at:
                              type: string
                              format: date-time
                          required: [order_id, total, currency]
                MoreEvents:
                  summary: A page with more pages after it
                  value:
                    events:
                      - name: "order.created"
                        delivery: ["webhook"]
                        inputSchema:
                          type: object
                          properties: {}
                          additionalProperties: false
                        payloadSchema:
                          type: object
                    nextCursor: "dDpvcmRlci5jcmVhdGVk"
                NoEvents:
                  summary: No MCP-enabled topic, or an empty topics allowlist
                  value:
                    events: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/MCPError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /tenants/{tenant_id}/mcp/subscriptions:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the tenant the subscription belongs to, which is the tenant your events for it are published to.
    put:
      tags: [MCP]
      summary: Subscribe (MCP)
      x-outpost-deployment: self-hosted
      description: |
        Creates or refreshes a webhook subscription from an `events/subscribe` request, and returns the `events/subscribe` result. Return it to the MCP client unchanged.

        The call is idempotent. The subscription ID is derived from `principal`, the normalized `params.delivery.url`, `params.name` and `params.arguments`, so the same request refreshes the existing subscription. Outpost:

        1. Validates `params` (see `MCPSubscribeRequest`): the event must be MCP-enabled and, when `allowed_topics` is set, in it, and `arguments` must match the event's `inputSchema`.
        2. Resolves the callback host and rejects it unless every address is globally routable per the IANA special-purpose address registries, or in `MCP_CALLBACK_ALLOWLIST`.
        3. Verifies the callback, unless verification for the same tenant, principal and URL passed within `MCP_VERIFICATION_TTL`: it POSTs a signed `{"type": "verification", "challenge": "<nonce>"}` envelope and requires a `2xx` response whose body is `{"challenge": "<nonce>"}`. Redirects are not followed. Each challenge counts toward `MCP_VERIFICATION_RATE_LIMIT` for the principal.
        4. Grants a TTL from `params.ttlMs`, then creates or updates the `mcp` destination with the subscription ID.

        A new subscription counts toward `MAX_MCP_SUBSCRIPTIONS_PER_TENANT` and `MAX_MCP_SUBSCRIPTIONS_PER_PRINCIPAL`. A refresh extends the expiry and replaces the secret when it changed, signing with the previous one too for `MCP_SECRET_ROTATION_GRACE`. It also re-enables an auto-disabled subscription and resumes its pending retries, and returns `deliveryStatus`. A subscription past its `expires_at` is deleted, reported as `mcp.subscription.expired`, and replaced by a new one. A refresh of a subscription created against a payload schema that a breaking change applied with `TOPICS_ALLOW_BREAKING_CHANGES` replaced deletes it and fails with `unsupported` (`{"feature": "payloadSchema", "reason": "schema_changed"}`), without a `terminated` envelope; subscribing again creates a new subscription.

        The tenant must exist. A missing tenant fails with `not_found` (`{"kind": "tenant"}`). An existing destination with the subscription ID that isn't an MCP subscription fails with `invalid_params` (`{"field": "id", "reason": "conflict"}`).

        Verification can take up to 10 seconds, and the whole call up to 20 seconds, so set your HTTP client timeout above 20 seconds.

        API v2 only. Requires the Admin API Key.
      operationId: subscribeMCP
      security:
        - AdminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPSubscribeRequest"
            example:
              principal: "user_8f2c"
              params:
                name: "order.created"
                arguments:
                  total:
                    $gte: 100
                  currency: "USD"
                delivery:
                  mode: "webhook"
                  url: "https://receiver.example.com/mcp-events/abc123"
                  secret: "whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw"
                cursor: null
              allowed_topics: ["order.created", "order.shipped"]
      responses:
        "200":
          description: The subscription was created or refreshed. The body is the `events/subscribe` result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPSubscribeResult"
              examples:
                Created:
                  summary: New subscription
                  value:
                    id: "sub_1fa69bec3707ee16223ae5400f92f935"
                    refreshBefore: "2026-10-09T18:00:00Z"
                    cursor: null
                    truncated: false
                Refreshed:
                  summary: Refresh of a live subscription
                  value:
                    id: "sub_1fa69bec3707ee16223ae5400f92f935"
                    refreshBefore: "2026-10-09T19:00:00Z"
                    cursor: null
                    truncated: false
                    deliveryStatus:
                      active: true
                      lastDeliveryAt: "2026-10-09T16:58:12Z"
                      lastError: null
                ReenabledAfterFailures:
                  summary: Refresh that re-enabled an auto-disabled subscription
                  value:
                    id: "sub_1fa69bec3707ee16223ae5400f92f935"
                    refreshBefore: "2026-10-09T19:00:00Z"
                    cursor: null
                    truncated: false
                    deliveryStatus:
                      active: false
                      lastDeliveryAt: "2026-10-09T15:45:00Z"
                      lastError: "http_5xx"
                NoExpiry:
                  summary: ttlMs null with MCP_ALLOW_NO_EXPIRY=true
                  value:
                    id: "sub_1fa69bec3707ee16223ae5400f92f935"
                    refreshBefore: null
                    cursor: null
                    truncated: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/RequestBodyTooLarge"
        "422":
          $ref: "#/components/responses/MCPError"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags: [MCP]
      summary: List MCP Subscriptions
      x-outpost-deployment: self-hosted
      description: |
        Lists the tenant's MCP subscriptions, optionally narrowed to one principal or one event. For you, not for MCP clients. The list isn't paginated: it holds at most `MAX_MCP_SUBSCRIPTIONS_PER_TENANT` subscriptions.

        A subscription past its `expires_at` stays listed until the background sweep deletes it: once it has been expired for twice `MCP_EXPIRY_SWEEP_INTERVAL`, between 5 and 60 seconds (60 seconds by default), at the next pass. No delivery is attempted after `expires_at`.

        API v2 only. Accepts a Tenant JWT.
      operationId: listMCPSubscriptions
      security:
        - AdminApiKey: []
        - TenantJwt: []
      parameters:
        - name: principal
          in: query
          required: false
          schema:
            type: string
          description: Only list this principal's subscriptions.
        - name: topic
          in: query
          required: false
          schema:
            type: string
          description: Only list subscriptions to this event name.
      responses:
        "200":
          description: The tenant's MCP subscriptions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MCPSubscription"
              example:
                - id: "sub_1fa69bec3707ee16223ae5400f92f935"
                  principal: "user_8f2c"
                  event: "order.created"
                  arguments:
                    total:
                      $gte: 100
                    currency: "USD"
                  url: "https://receiver.example.com/mcp-events/abc123"
                  filter:
                    data:
                      total:
                        $gte: 100
                      currency: "USD"
                  expires_at: "2026-10-09T18:00:00.123Z"
                  created_at: "2026-10-09T17:00:00Z"
                  updated_at: "2026-10-09T17:00:00Z"
                  disabled_at: null
                  metadata:
                    plugin: "chatgpt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/MCPError"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [MCP]
      summary: Delete a Principal's MCP Subscriptions
      x-outpost-deployment: self-hosted
      description: |
        Ends every subscription of one principal in the tenant, for a disconnected account or revoked access.

        Outpost first records the revocation for 10 minutes, so a subscribe call for this principal that is already in flight can't recreate a subscription after this call returns. It then deletes each subscription, drops its pending retries, and sends it a `terminated` envelope with the `Forbidden` error and `{"reason": "access_revoked"}` (unless `MCP_SEND_TERMINATED=false`). It doesn't block subscribe calls that start afterward: your MCP server must deny them.

        A missing or empty `principal` fails with `invalid_params` (`{"field": "principal"}`).

        API v2 only. Requires the Admin API Key.
      operationId: deleteMCPSubscriptions
      security:
        - AdminApiKey: []
      parameters:
        - name: principal
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: The principal whose subscriptions to end.
      responses:
        "200":
          description: The principal's subscriptions were deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPSubscriptionsDeleteResult"
              example:
                success: true
                deleted: 3
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/MCPError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /tenants/{tenant_id}/mcp/subscriptions/unsubscribe:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the tenant the subscription belongs to.
    post:
      tags: [MCP]
      summary: Unsubscribe (MCP)
      x-outpost-deployment: self-hosted
      description: |
        Ends a subscription from an `events/unsubscribe` request, and returns the `events/unsubscribe` result, `{}`. Return it to the MCP client unchanged.

        Outpost derives the subscription ID the way subscribe does, deletes the subscription and drops its pending retries. It returns `{}` whether or not anything matched, including when the tenant doesn't exist. It doesn't check the event against the current topics, so a subscription to a topic that is no longer MCP-enabled can still be removed. No `terminated` envelope is sent.

        Only a malformed request fails, with `invalid_params`: a missing `principal` or `params.name`, `arguments` that aren't an object or exceed 4 KiB, or a `delivery.url` that can't be normalized.

        API v2 only. Requires the Admin API Key.
      operationId: unsubscribeMCP
      security:
        - AdminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPUnsubscribeRequest"
            example:
              principal: "user_8f2c"
              params:
                name: "order.created"
                arguments:
                  total:
                    $gte: 100
                  currency: "USD"
                delivery:
                  mode: "webhook"
                  url: "https://receiver.example.com/mcp-events/abc123"
      responses:
        "200":
          description: The `events/unsubscribe` result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPEmptyResult"
              example: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/RequestBodyTooLarge"
        "422":
          $ref: "#/components/responses/MCPError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /tenants/{tenant_id}/mcp/subscriptions/{subscription_id}:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the tenant. Required when using AdminApiKey authentication.
      - name: subscription_id
        in: path
        required: true
        schema:
          type: string
        description: The subscription ID, which is also its destination ID.
    delete:
      tags: [MCP]
      summary: Delete MCP Subscription
      x-outpost-deployment: self-hosted
      description: |
        Ends one subscription, for revoked access or a tenant disconnecting an agent. The tenant portal's **Disconnect** action calls it.

        Outpost deletes the subscription, drops its pending retries, and sends a `terminated` envelope with the `Forbidden` error and `{"reason": "access_revoked"}` to the callback URL (unless `MCP_SEND_TERMINATED=false`). Returns `404` when the tenant has no MCP subscription with this ID, including when the ID belongs to another destination type.

        This only ends the subscription. If the principal keeps access to the event, the MCP client can subscribe again.

        API v2 only. Accepts a Tenant JWT.
      operationId: deleteMCPSubscription
      security:
        - AdminApiKey: []
        - TenantJwt: []
      responses:
        "200":
          description: The subscription was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/MCPError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # Publish (Admin Only)
  /publish:
    post:
      tags: [Publish]
      summary: Publish Event
      description: |
        Publishes an event to the specified topic, potentially routed to a specific destination. Requires Admin API Key.

        When the topic's schema `validation` is `enforce`, `data` must match the topic's `payload_schema`, or the request fails with `422`. This applies to API v1 and v2 alike.
      operationId: publishEvent
      security:
        - AdminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
            example:
              id: "evt_abc123xyz789"
              tenant_id: "tenant_123"
              topic: "user.created"
              eligible_for_retry: true
              metadata:
                source: "crm"
              data:
                user_id: "userid"
                status: "active"
      responses:
        "202":
          description: Event accepted for publishing. Returns the event ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResponse"
              example:
                id: "evt_abc123xyz789"
                duplicate: false
                destination_ids: ["des_webhook_123"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Conflict. Another request with the same event `id` is in progress or has just failed. Retry the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "422":
          description: |
            Validation error, with the problems listed in `data`. Causes include:

            - `data` is not a JSON object.
            - `topic` is missing while topics are configured, or is not one of them.
            - The topic's `validation` is `enforce` and `data` fails its `payload_schema`, or repeats a key within an object. Each entry is a path from `data` and a message, such as `data.total: must be number`. Entries never contain published values. At most 20 are listed, sorted, followed by a final `... and N more` (or `... and more`) entry.
            - The topic's `validation` is `enforce` and `data` is larger than the schema validation size limit (`TOPICS_VALIDATION_MAX_BYTES` on self-hosted Outpost, 256 KiB by default).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
              examples:
                SchemaValidationError:
                  summary: Data fails the topic schema
                  value:
                    status: 422
                    message: "validation error"
                    data:
                      - "data.total: must be number"
                      - 'data: missing required property "currency"'
                SchemaValidationTooLarge:
                  summary: Data over the validation size limit
                  value:
                    status: 422
                    message: "validation error"
                    data: ["data exceeds the schema validation size limit"]
                InvalidTopic:
                  summary: Topic not configured
                  value:
                    status: 422
                    message: "validation error"
                    data: ["topic is invalid"]
        "500":
          $ref: "#/components/responses/InternalServerError"

  # Retry
  /retry:
    post:
      tags: [Retry]
      summary: Retry Event Delivery
      description: |
        Triggers a retry for delivering an event to a destination. The event must exist, and the destination must be enabled, match the event's topic and filter, and already have a delivery attempt for the event. A retry never sends an event to a destination that has no earlier attempt for it.

        Returns 404 `event not found` if the event does not exist, or belongs to another tenant when authenticated with a Tenant JWT. Returns 404 `destination not found` if the destination does not exist for the event's tenant or has been deleted.

        When authenticated with a Tenant JWT, only events belonging to that tenant can be retried.
        When authenticated with Admin API Key, events from any tenant can be retried.
      operationId: retryEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryRequest"
            example:
              event_id: "evt_abc123xyz789"
              destination_id: "des_webhook_123"
      responses:
        "202":
          description: Retry accepted for processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              examples:
                RetryAccepted:
                  value:
                    success: true
        "400":
          description: |
            Bad request. This can happen when:
            - The destination is disabled
            - The destination is an MCP Events subscription past its `expires_at` (`data.error` is `destination_expired`)
            - The destination does not match the event's topic or filter
            - The event has no delivery attempt for the destination
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestBodyTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"


  /events:
    get:
      tags: [Events]
      summary: List Events
      description: |
        Retrieves a list of events.

        When authenticated with a Tenant JWT, returns only events belonging to that tenant.
        When authenticated with Admin API Key, returns events across all tenants. Use `tenant_id` query parameter to filter by tenant.
      operationId: listEvents
      security:
        - AdminApiKey: []
        - TenantJwt: []
      parameters:
        - name: id
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: Filter events by ID(s). Use bracket notation for multiple values (e.g., `id[0]=abc&id[1]=def`).
        - name: tenant_id
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: |
            Filter events by tenant ID(s). Use bracket notation for multiple values (e.g., `tenant_id[0]=t1&tenant_id[1]=t2`).
            When authenticated with a Tenant JWT, this parameter is ignored and the JWT's tenant is used.
            If not provided with API key auth, returns events from all tenants.

        - name: destination_id
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: >-
            Filter events by matched destination ID(s). Returns events that were routed to the specified destination(s). Use bracket notation for multiple values (e.g., `destination_id[0]=d1&destination_id[1]=d2`). Events don't record MCP Events subscriptions in `matched_destination_ids`, so an MCP subscription ID matches no events: list its attempts instead.
        - name: topic
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: Filter events by topic(s). Use bracket notation for multiple values (e.g., `topic[0]=user.created&topic[1]=user.updated`).
        - name: time
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            $ref: "#/components/schemas/Operator"
          description: Filter events by time range using comparison operators.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
          description: Number of items per page (1-1000, default 100). A value outside this range, or one that is not an integer, returns a 400.
        - name: next
          in: query
          required: false
          schema:
            type: string
          description: Cursor for the next page of results, from `pagination.next` of a previous response. Mutually exclusive with `prev`. A cursor that cannot be read returns a 400.
        - name: prev
          in: query
          required: false
          schema:
            type: string
          description: Cursor for the previous page of results, from `pagination.prev` of a previous response. Mutually exclusive with `next`. A cursor that cannot be read returns a 400.
        - name: order_by
          in: query
          required: false
          schema:
            type: string
            enum: [time]
            default: time
          description: Field to sort by.
        - name: dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction.
      responses:
        "200":
          description: A paginated list of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPaginatedResult"
              examples:
                AdminEventsListExample:
                  value:
                    pagination:
                      order_by: "time"
                      dir: "desc"
                      limit: 100
                      next: "MTcwNDA2NzIwMA=="
                      prev: null
                    models:
                      - id: "evt_123"
                        topic: "user.created"
                        matched_destination_ids: ["des_456"]
                        time: "2024-01-01T00:00:00Z"
                        eligible_for_retry: false
                        metadata: { "source": "crm" }
                        data: { "user_id": "userid", "status": "active" }
                      - id: "evt_789"

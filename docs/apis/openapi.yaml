          type: string
        description: The ID of the tenant. Required when using AdminApiKey authentication.
      - name: destination_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the destination.
    get:
      tags: [Destinations]
      summary: List Destination Attempts
      description: |
        Retrieves a paginated list of attempts scoped to a specific destination.

        Returns `404` if the destination does not exist or has been deleted. The attempts of a deleted destination remain available from `GET /attempts?destination_id=`.

        API v1 doesn't return attempts to MCP Events subscriptions (type `mcp`).
      operationId: listTenantDestinationAttempts
      parameters:
        - name: event_id
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: Filter attempts by event ID(s). Use bracket notation for multiple values (e.g., `event_id[0]=e1&event_id[1]=e2`).
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [success, failed]
          description: Filter attempts by status.
        - name: topic
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: Filter attempts by event topic(s). Use bracket notation for multiple values (e.g., `topic[0]=user.created&topic[1]=user.updated`).
        - name: time
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            $ref: "#/components/schemas/Operator"
          description: Filter attempts by event time range using comparison operators.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
          description: Number of items per page (1-1000, default 100). A value outside this range, or one that is not an integer, returns a 400.
        - name: next
          in: query
          required: false
          schema:
            type: string
          description: Cursor for the next page of results, from `pagination.next` of a previous response. Mutually exclusive with `prev`. A cursor that cannot be read returns a 400.
        - name: prev
          in: query
          required: false
          schema:
            type: string
          description: Cursor for the previous page of results, from `pagination.prev` of a previous response. Mutually exclusive with `next`. A cursor that cannot be read returns a 400.
        - name: include
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: |
            Fields to include in the response. Use bracket notation for multiple values (e.g., `include[0]=event&include[1]=response_data`).
            - `event`: Include event summary (id, topic, time, eligible_for_retry, metadata)
            - `event.data`: Include full event with payload data
            - `response_data`: Include response body and headers
            - `destination`: Include the destination object, without credentials
        - name: order_by
          in: query
          required: false
          schema:
            type: string
            enum: [time]
            default: time
          description: Field to sort by.
        - name: dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction.
      responses:
        "200":
          description: A paginated list of attempts for the destination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptPaginatedResult"
              examples:
                DestinationAttemptsListExample:
                  value:
                    pagination:
                      order_by: "time"
                      dir: "desc"
                      limit: 100
                      next: "MTcwNDA2NzIwMA=="
                      prev: null
                    models:
                      - id: "atm_123"
                        status: "success"
                        time: "2024-01-01T00:00:05Z"
                        code: "200"
                        attempt_number: 1
                        latency_ms: 212
                        event_id: "evt_123"
                        destination_id: "des_456"
                      - id: "atm_124"
                        status: "failed"
                        time: "2024-01-02T10:00:01Z"
                        code: "503"
                        attempt_number: 2
                        latency_ms: 1502
                        event_id: "evt_789"
                        destination_id: "des_456"

        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"


      description: |
        Retrieves details for a specific event.

        When authenticated with a Tenant JWT, only events belonging to that tenant can be accessed.
        When authenticated with Admin API Key, events from any tenant can be accessed.
      operationId: getEvent
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by tenant ID. Returns 404 if the event does not belong to the specified tenant. Ignored when using Tenant JWT authentication.
      responses:
        "200":
          description: Event details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
              examples:
                EventExample:
                  value:
                    id: "evt_123"
                    topic: "user.created"
                    matched_destination_ids: ["des_456"]
                    time: "2024-01-01T00:00:00Z"
                    eligible_for_retry: false
                    metadata: { "source": "crm" }
                    data: { "user_id": "userid", "status": "active" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /attempts:
    get:
      tags: [Attempts]
      summary: List Attempts
      description: |
        Retrieves a paginated list of attempts.

        When authenticated with a Tenant JWT, returns only attempts belonging to that tenant.
        When authenticated with Admin API Key, returns attempts across all tenants. Use `tenant_id` query parameter to filter by tenant.

        API v1 doesn't return attempts to MCP Events subscriptions (type `mcp`). In API v2, they are the way to see deliveries to MCP subscriptions, which events don't record in `matched_destination_ids`.
      operationId: listAttempts
      security:
        - AdminApiKey: []
        - TenantJwt: []
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: |
            Filter attempts by tenant ID(s). Use bracket notation for multiple values (e.g., `tenant_id[0]=t1&tenant_id[1]=t2`).
            When authenticated with a Tenant JWT, this parameter is ignored and the JWT's tenant is used.
            If not provided with API key auth, returns attempts from all tenants.
        - name: event_id
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: Filter attempts by event ID(s). Use bracket notation for multiple values (e.g., `event_id[0]=e1&event_id[1]=e2`).
        - name: destination_id
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: Filter attempts by destination ID(s). Use bracket notation for multiple values (e.g., `destination_id[0]=d1&destination_id[1]=d2`).
        - name: destination_type
          in: query
          required: false
          schema:
            oneOf:
              - $ref: "#/components/schemas/DestinationType"
              - type: array
                items:
                  $ref: "#/components/schemas/DestinationType"
          description: Filter attempts by destination type(s). Use bracket notation for multiple values (e.g., `destination_type[0]=webhook&destination_type[1]=aws_sqs`).
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [success, failed]
          description: Filter attempts by status.
        - name: topic
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: Filter attempts by event topic(s). Use bracket notation for multiple values (e.g., `topic[0]=user.created&topic[1]=user.updated`).
        - name: time
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            $ref: "#/components/schemas/Operator"
          description: Filter attempts by event time range using comparison operators.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
          description: Number of items per page (1-1000, default 100). A value outside this range, or one that is not an integer, returns a 400.
        - name: next
          in: query
          required: false
          schema:
            type: string
          description: Cursor for the next page of results, from `pagination.next` of a previous response. Mutually exclusive with `prev`. A cursor that cannot be read returns a 400.
        - name: prev
          in: query
          required: false
          schema:
            type: string
          description: Cursor for the previous page of results, from `pagination.prev` of a previous response. Mutually exclusive with `next`. A cursor that cannot be read returns a 400.
        - name: include
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: |
            Fields to include in the response. Use bracket notation for multiple values (e.g., `include[0]=event&include[1]=response_data`).
            - `event`: Include event summary (id, topic, time, eligible_for_retry, metadata)
            - `event.data`: Include full event with payload data
            - `response_data`: Include response body and headers
            - `destination`: Include the destination object, without credentials
        - name: order_by
          in: query
          required: false
          schema:
            type: string
            enum: [time]
            default: time
          description: Field to sort by.
        - name: dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction.
      responses:
        "200":
          description: A paginated list of attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptPaginatedResult"
              examples:
                AdminAttemptsListExample:
                  value:
                    pagination:
                      order_by: "time"
                      dir: "desc"
                      limit: 100
                      next: "MTcwNDA2NzIwMA=="
                      prev: null
                    models:
                      - id: "atm_123"
                        status: "success"
                        time: "2024-01-01T00:00:05Z"
                        code: "200"
                        attempt_number: 1
                        latency_ms: 212
                        event_id: "evt_123"
                        destination_id: "des_456"
                      - id: "att_124"
                        status: "failed"
                        time: "2024-01-02T10:00:01Z"
                        code: "503"
                        attempt_number: 2
                        latency_ms: 1502
                        event_id: "evt_789"
                        destination_id: "des_789"

                AdminAttemptsWithIncludeExample:
                  summary: Response with include=event
                  value:
                    pagination:
                      order_by: "time"
                      dir: "desc"
                      limit: 100
                      next: null
                      prev: null
                    models:
                      - id: "del_123"
                        status: "success"
                        time: "2024-01-01T00:00:05Z"
                        code: "200"
                        attempt_number: 1
                        latency_ms: 212
                        event_id: "evt_123"
                        destination_id: "des_456"
                        event:
                          id: "evt_123"
                          topic: "user.created"
                          time: "2024-01-01T00:00:00Z"
                          eligible_for_retry: false
                          metadata: { "source": "crm" }

        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"


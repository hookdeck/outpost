  /destination-types/{type}:
    parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum: [webhook, aws_sqs, rabbitmq, hookdeck, aws_kinesis, azure_servicebus, aws_s3, gcp_pubsub, kafka, cloudflare_queues, aws_eventbridge, mcp]
        description: The type of the destination.
    get:
      tags: [Schemas]
      summary: Get Destination Type Schema
      description: |
        Returns the input schema for a specific destination type.

        `mcp` returns `404` in API v1, and in API v2 until at least one topic has `mcp.enabled` set.
      operationId: getDestinationTypeSchema
      responses:
        "200":
          description: The schema for the specified destination type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationTypeSchema"
              examples:
                WebhookSchemaExample: # Same as /{tenant_id}/destination-types/{type} example
                  value:
                    type: "webhook"
                    label: "Webhook"
                    description: "Send event via an HTTP POST request to a URL"
                    icon: "<svg />"
                    create_mode: "form"
                    instructions: "Enter the URL..."
                    # setup_link is optional, omitted here
                    config_fields: [
                        {
                          key: "url",
                          type: "text",
                          label: "URL",
                          description: "The URL to send the webhook to.",
                          pattern: "^https?://.*", # Example pattern
                          required: true,
                        },
                      ]
                    credential_fields: [
                        {
                          key: "secret",
                          type: "text",
                          label: "Secret",
                          description: "Optional signing secret.",
                          required: false,
                          sensitive: true, # Added sensitive
                        },
                      ]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /topics:
    get:
      tags: [Topics]
      summary: List Available Topics
      description: |
        Returns the topics configured in the Outpost instance, in `TOPICS` order, with their schema configuration.

        In API v1 (`/api/v1` and every managed dated version), this endpoint returns the topic names only, as an array of strings such as `["user.created", "order.shipped"]`.
      operationId: listTopics
      responses:
        "200":
          description: A list of topic objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopicSchema"
              examples:
                TopicsListExample:
                  value:
                    - name: "order.created.v2"
                      description: "Fires when a new order is placed."
                      payload_schema:
                        type: object
                        properties:
                          order_id:
                            type: string
                            x-mcp-filter: false
                          total:
                            type: number
                            description: Order total in major units.
                          currency:
                            type: string
                            description: ISO 4217 currency code.
                        required: [order_id, total, currency]
                      validation: "enforce"
                      mcp:
                        enabled: true
                    - name: "order.created"
                      description: "Fires when a new order is placed."
                      payload_schema:
                        type: object
                        properties:
                          order_id:
                            type: string
                          amount:
                            type: integer
                      validation: "warn"
                      mcp:
                        enabled: false
                      deprecated: true
                      replaced_by: "order.created.v2"
                    - name: "user.created"
                      validation: "off"
                      mcp:
                        enabled: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /metrics/events:
    get:
      tags: [Metrics]
      summary: Get Event Metrics
      description: |
        Returns aggregated event publish metrics. Supports time bucketing via granularity,
        dimensional grouping, and filtering.

        **Measures:** `count`, `rate`

        **Dimensions:** `tenant_id` (admin-only), `topic`, `destination_id`

        **Filters:** `tenant_id` (admin-only), `topic`, `destination_id`

        `destination_id` comes from the events' `matched_destination_ids`, which never lists MCP Events subscriptions. Attempt metrics include deliveries to MCP subscriptions in API v1 and v2.
      operationId: getEventMetrics
      parameters:
        - name: time
          in: query
          required: true
          style: deepObject
          explode: true
          schema:
            type: object
            required:
              - start
              - end
            properties:
              start:
                type: string
                format: date-time
                description: Start of the time range (inclusive). ISO 8601 timestamp.
                example: "2026-03-02T00:00:00Z"
              end:
                type: string
                format: date-time
                description: End of the time range (exclusive). ISO 8601 timestamp.
                example: "2026-03-03T00:00:00Z"
          description: Time range for the metrics query.
        - name: granularity
          in: query
          required: false
          schema:
            type: string
          description: |
            Time bucketing granularity. Pattern: `<number><unit>`.
            Units: `s` (1-60), `m` (1-60), `h` (1-24), `d` (1-31), `w` (1-4), `M` (1-12).
            When omitted, returns a single aggregate row per dimension combination.
          example: "1h"
        - name: measures
          in: query
          required: true
          schema:
            oneOf:
              - type: string
                enum: [count, rate]
              - type: array
                items:
                  type: string
                  enum: [count, rate]
          description: Measures to compute. At least one required. `rate` is events/second throughput. Use bracket notation for multiple values (e.g., `measures[0]=count`).
          example: ["count"]
        - name: dimensions
          in: query
          required: false
          schema:
            oneOf:
              - type: string
                enum: [tenant_id, topic, destination_id]
              - type: array
                items:
                  type: string
                  enum: [tenant_id, topic, destination_id]
          description: Dimensions to group results by. Use bracket notation for multiple values (e.g., `dimensions[0]=topic&dimensions[1]=destination_id`).
        - name: filters[topic]
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: Filter by topic name(s). Use bracket notation for multiple values (e.g., `filters[topic][0]=user.created&filters[topic][1]=user.updated`).
        - name: filters[destination_id]
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: Filter by destination ID(s). Use bracket notation for multiple values (e.g., `filters[destination_id][0]=d1&filters[destination_id][1]=d2`).
        - name: filters[tenant_id]
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: Filter by tenant ID(s). Admin-only — rejected with 403 for JWT callers. Use bracket notation for multiple values (e.g., `filters[tenant_id][0]=t1&filters[tenant_id][1]=t2`).
      responses:
        "200":
          description: Aggregated event metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
              examples:
                HourlyEventCount:
                  value:
                    data:
                      - time_bucket: "2026-03-02T14:00:00Z"
                        dimensions:
                          topic: "user.created"
                        metrics:
                          count: 1423
                      - time_bucket: "2026-03-02T15:00:00Z"
                        dimensions:
                          topic: "user.created"
                        metrics:
                          count: 1891
                    metadata:
                      granularity: "1h"
                      query_time_ms: 42
                      row_count: 2
                      row_limit: 100000
                      truncated: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: JWT caller attempted to use admin-only dimension or filter (tenant_id).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /metrics/attempts:
    get:
      tags: [Metrics]
      summary: Get Attempt Metrics
      description: |
        Returns aggregated delivery attempt metrics. Supports time bucketing via granularity,
        dimensional grouping, and filtering.

        **Measures:** `count`, `successful_count`, `failed_count`, `error_rate`,
        `first_attempt_count`, `retry_count`, `manual_retry_count`, `avg_attempt_number`,
        `rate`, `successful_rate`, `failed_rate`, `avg_latency`, `p50_latency`, `p95_latency`, `p99_latency`

        Latency measures are in milliseconds and computed over attempts that recorded a
        latency (see `latency_ms` on the attempt object). They are `null` for a bucket
        with no such attempts, rather than `0`.

        **Dimensions:** `tenant_id` (admin-only), `destination_id`, `destination_type`, `topic`, `status`, `code`, `manual`, `attempt_number`

        **Filters:** `tenant_id` (admin-only), `destination_id`, `destination_type`, `topic`, `status`, `code`, `manual`, `attempt_number`
      operationId: getAttemptMetrics
      parameters:
        - name: time
          in: query
          required: true
          style: deepObject
          explode: true
          schema:
            type: object
            required:
              - start
              - end
            properties:
              start:
                type: string
                format: date-time
                description: Start of the time range (inclusive). ISO 8601 timestamp.
                example: "2026-03-02T00:00:00Z"
              end:
                type: string
                format: date-time
                description: End of the time range (exclusive). ISO 8601 timestamp.
                example: "2026-03-03T00:00:00Z"
          description: Time range for the metrics query.
        - name: granularity
          in: query
          required: false
          schema:
            type: string
          description: |
            Time bucketing granularity. Pattern: `<number><unit>`.
            Units: `s` (1-60), `m` (1-60), `h` (1-24), `d` (1-31), `w` (1-4), `M` (1-12).
            When omitted, returns a single aggregate row per dimension combination.
          example: "1h"
        - name: measures
          in: query
          required: true
          schema:
            oneOf:
              - type: string
                enum: [count, successful_count, failed_count, error_rate, first_attempt_count, retry_count, manual_retry_count, avg_attempt_number, rate, successful_rate, failed_rate, avg_latency, p50_latency, p95_latency, p99_latency]
              - type: array
                items:
                  type: string
                  enum: [count, successful_count, failed_count, error_rate, first_attempt_count, retry_count, manual_retry_count, avg_attempt_number, rate, successful_rate, failed_rate, avg_latency, p50_latency, p95_latency, p99_latency]
          description: Measures to compute. At least one required. Rate measures (`rate`, `successful_rate`, `failed_rate`) are throughput in events/second. Latency measures (`avg_latency`, `p50_latency`, `p95_latency`, `p99_latency`) are destination response times in milliseconds, `null` when no attempt in the bucket recorded a latency. Use bracket notation for multiple values (e.g., `measures[0]=count&measures[1]=error_rate`).
          example: ["count", "error_rate", "p95_latency"]
        - name: dimensions
          in: query
          required: false
          schema:
            oneOf:
              - type: string
                enum: [tenant_id, destination_id, destination_type, topic, status, code, manual, attempt_number]
              - type: array
                items:
                  type: string
                  enum: [tenant_id, destination_id, destination_type, topic, status, code, manual, attempt_number]
          description: Dimensions to group results by. Use bracket notation for multiple values (e.g., `dimensions[0]=status&dimensions[1]=destination_id`).
        - name: filters[destination_id]
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: Filter by destination ID(s). Use bracket notation for multiple values (e.g., `filters[destination_id][0]=d1&filters[destination_id][1]=d2`).
        - name: filters[destination_type]
          in: query
          required: false
          schema:
            oneOf:
              - $ref: "#/components/schemas/DestinationType"
              - type: array
                items:
                  $ref: "#/components/schemas/DestinationType"
          description: Filter by destination type(s). Use bracket notation for multiple values (e.g., `filters[destination_type][0]=webhook&filters[destination_type][1]=aws_sqs`).
        - name: filters[topic]
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: Filter by topic name(s). Use bracket notation for multiple values (e.g., `filters[topic][0]=user.created&filters[topic][1]=user.updated`).
        - name: filters[status]
          in: query
          required: false
          schema:
            oneOf:
              - type: string
                enum: [success, failed]
              - type: array
                items:
                  type: string
                  enum: [success, failed]
          description: Filter by attempt status(es). Use bracket notation for multiple values (e.g., `filters[status][0]=success&filters[status][1]=failed`).
        - name: filters[code]
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: Filter by HTTP status code(s). Use bracket notation for multiple values (e.g., `filters[code][0]=200&filters[code][1]=500`).
        - name: filters[manual]
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter by manual retry flag.
        - name: filters[attempt_number]
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: Filter by attempt number(s). Use bracket notation for multiple values (e.g., `filters[attempt_number][0]=1&filters[attempt_number][1]=2`).
        - name: filters[tenant_id]
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: Filter by tenant ID(s). Admin-only — rejected with 403 for JWT callers. Use bracket notation for multiple values (e.g., `filters[tenant_id][0]=t1&filters[tenant_id][1]=t2`).
      responses:
        "200":
          description: Aggregated attempt metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
              examples:
                DailyAttemptCounts:
                  value:
                    data:
                      - time_bucket: "2026-03-02T00:00:00Z"
                        dimensions:
                          destination_id: "dest_abc"
                        metrics:
                          count: 1423
                          successful_count: 1393
                          failed_count: 30
                          error_rate: 0.0211
                          avg_latency: 212.4
                          p95_latency: 810
                    metadata:
                      granularity: "1d"

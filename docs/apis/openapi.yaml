      parameters:
        - name: id
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: Filter tenants by ID(s). Use bracket notation for multiple values (e.g., `id[0]=t1&id[1]=t2` or `id[]=t1&id[]=t2`).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Number of tenants to return per page (1-100, default 20).
        - name: dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction.
        - name: next
          in: query
          required: false
          schema:
            type: string
          description: Cursor for the next page of results. Mutually exclusive with `prev`.
        - name: prev
          in: query
          required: false
          schema:
            type: string
          description: Cursor for the previous page of results. Mutually exclusive with `next`.
      responses:
        "200":
          description: List of tenants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantPaginatedResult"
              example:
                pagination:
                  order_by: "created_at"
                  dir: "desc"
                  limit: 20
                  next: "MTcwNDA2NzIwMA=="
                  prev: null
                count: 2
                models:
                  - id: "tenant_123"
                    metadata:
                      plan: "pro"
                    created_at: "2024-01-15T10:30:00Z"
                    updated_at: "2024-01-15T10:30:00Z"
                  - id: "tenant_456"
                    metadata: null
                    created_at: "2024-01-14T09:00:00Z"
                    updated_at: "2024-01-14T09:00:00Z"

        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "501":

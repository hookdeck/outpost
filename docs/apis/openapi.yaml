    # Polymorphic Destination Update Schema (for Request Bodies)
    DestinationUpdate:
      oneOf:
        - $ref: "#/components/schemas/DestinationUpdateWebhook"
        - $ref: "#/components/schemas/DestinationUpdateHookdeck"
        - $ref: "#/components/schemas/DestinationUpdateAWSSQS"
        - $ref: "#/components/schemas/DestinationUpdateAWSKinesis"
        - $ref: "#/components/schemas/DestinationUpdateAWSS3"
        - $ref: "#/components/schemas/DestinationUpdateAzureServiceBus"
        - $ref: "#/components/schemas/DestinationUpdateGCPPubSub"
        - $ref: "#/components/schemas/DestinationUpdateRabbitMQ"
        - $ref: "#/components/schemas/DestinationUpdateKafka"
        - $ref: "#/components/schemas/DestinationUpdateCloudflareQueues"
        - $ref: "#/components/schemas/DestinationUpdateAWSEventBridge"
      discriminator:
        propertyName: type
        mapping:
          webhook: "#/components/schemas/DestinationUpdateWebhook"
          aws_sqs: "#/components/schemas/DestinationUpdateAWSSQS"
          rabbitmq: "#/components/schemas/DestinationUpdateRabbitMQ"
          hookdeck: "#/components/schemas/DestinationUpdateHookdeck"
          aws_kinesis: "#/components/schemas/DestinationUpdateAWSKinesis"
          azure_servicebus: "#/components/schemas/DestinationUpdateAzureServiceBus"
          aws_s3: "#/components/schemas/DestinationUpdateAWSS3"
          gcp_pubsub: "#/components/schemas/DestinationUpdateGCPPubSub"
          kafka: "#/components/schemas/DestinationUpdateKafka"
          cloudflare_queues: "#/components/schemas/DestinationUpdateCloudflareQueues"
          aws_eventbridge: "#/components/schemas/DestinationUpdateAWSEventBridge"
    # Event Schemas
    PublishRequest:
      type: object
      required:
        - data
      properties:
        id:
          type: string
          description: Optional. A unique identifier for the event. If not provided, a ID will be generated.
          example: "evt_custom_123"
        tenant_id:
          type: string
          description: The ID of the tenant to publish for.
          example: "<TENANT_ID>"
        destination_id:
          type: string
          description: Optional. Route event to a specific destination.
          example: "<DESTINATION_ID>"
        topic:
          type: string
          description: Topic name for the event. Required if Outpost has been configured with topics.
          example: "topic.name"
        eligible_for_retry:
          type: boolean
          description: Should event delivery be retried on failure.
        time:
          type: string
          format: date-time
          description: Optional. Custom timestamp for the event. If not provided, defaults to the current time.
          example: "2024-01-15T10:30:00Z"
        metadata:
          type: object
          description: Any key-value string pairs for metadata.
          additionalProperties:
            type: string
          example: { "source": "crm" }
        data:
          type: object
          description: Any JSON payload for the event data.
          additionalProperties: true
          example: { "user_id": "userid", "status": "active" }
    PublishResponse:
      type: object
      required:
        - id
        - duplicate
        - destination_ids
      properties:
        id:
          type: string
          description: The ID of the event that was accepted for publishing. This will be the ID provided in the request's `id` field if present, otherwise it's a server-generated ID.
          example: "evt_abc123xyz789"
        duplicate:
          type: boolean
          description: Whether this event was already processed (idempotency hit). If true, the event was not queued again.
          example: false
        destination_ids:
          type: array
          items:
            type: string
          description: The IDs of destinations that matched this event. Empty array if no destinations matched. In API v2, it includes matching MCP Events subscriptions (type `mcp`). API v1 leaves them out.
          example: ["des_456", "des_789"]
    RetryRequest:
      type: object
      description: Request body for retrying event delivery to a destination.
      required:
        - event_id
        - destination_id
      properties:
        event_id:
          type: string
          description: The ID of the event to retry.
          example: "evt_123"
        destination_id:
          type: string
          description: The ID of the destination to deliver to.
          example: "des_456"
    Event:
      type: object
      properties:
        id:
          type: string
          example: "evt_123"
        tenant_id:
          type: string
          description: The tenant this event belongs to.
          example: "tnt_123"
        matched_destination_ids:
          type: array
          items:
            type: string
          description: The destination IDs that this event was routed to based on topic and filter matching. MCP Events subscriptions (type `mcp`) are never listed, in API v1 or v2, so the list stays bounded however many agents subscribe. Find deliveries to them through the attempts endpoints.
          example: ["des_456", "des_789"]
        topic:
          type: string
          example: "user.created"
        time:
          type: string
          format: date-time
          description: Time the event was received/processed.
          example: "2024-01-01T00:00:00Z"
        eligible_for_retry:
          type: boolean
          description: Whether this event can be retried.
          example: true
        schema_valid:
          type: boolean
          description: Result of publish-time validation of `data` against the topic's `payload_schema`. `true` when `data` passed, `false` when it failed in a topic whose `validation` is `warn`. Omitted when the event was not validated, because the topic's `validation` is `off` or `data` was over the validation size limit.
          example: true
        metadata:
          type: object
          nullable: true
          description: Key-value string pairs of metadata associated with the event.
          additionalProperties:
            type: string
          example: { "source": "crm" }
        data:
          type: object
          description: Freeform JSON data of the event.
          additionalProperties: true
          example: { "user_id": "userid", "status": "active" }
    # Attempt schemas for attempts-first API
    AttemptDestination:
      type: object
      description: The destination an attempt was sent to, without credentials. Use the destination endpoints to retrieve credentials.
      required: [id, tenant_id, type, topics, config, created_at, updated_at, disabled_at, target]
      properties:
        id:
          type: string
          description: Control plane generated ID or user provided ID for the destination.
          example: "des_12345"
        tenant_id:
          type: string
          description: The tenant the destination belongs to.
          example: "tenant_123"
        type:
          type: string
          description: Type of the destination.
          example: "webhook"
        topics:
          $ref: "#/components/schemas/Topics"
        filter:
          $ref: "#/components/schemas/Filter"
        config:
          type: object
          additionalProperties:
            type: string
          description: Type-specific destination configuration.
          example: { "url": "https://my-service.com/webhook/handler" }
        delivery_metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Static key-value pairs merged into event metadata on every attempt.
          example: { "app-id": "my-app", "region": "us-east-1" }
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Arbitrary contextual information stored with the destination.
          example: { "internal-id": "123", "team": "platform" }
        disabled_at:
          type: string
          format: date-time
          nullable: true
          description: ISO Date when the destination was disabled, or null if enabled.
          example: null
        expires_at:
          type: string
          format: date-time
          description: When the destination expires. Only set on MCP Events subscriptions (type `mcp`) that have an expiry.
          example: "2026-10-09T18:00:00.123Z"
        created_at:
          type: string
          format: date-time
          description: ISO Date when the destination was created.
          example: "2024-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: ISO Date when the destination was last updated.
          example: "2024-01-01T00:00:00Z"
        target:
          type: string
          description: A human-readable representation of the destination target (e.g., URL host). Read-only.
          readOnly: true
          example: "my-service.com"
        target_url:
          type: string
          format: url
          nullable: true
          description: A URL link to the destination target. Read-only.
          readOnly: true
          example: "https://my-service.com/webhook/handler"
    Attempt:
      type: object
      description: An attempt represents a single delivery attempt of an event to a destination.
      properties:
        id:
          type: string
          description: Unique identifier for this attempt.
          example: "atm_123"
        tenant_id:
          type: string
          description: The tenant this attempt belongs to.
          example: "tnt_123"
        status:
          type: string
          enum: [success, failed]
          description: The attempt status.
          example: "success"
        time:
          type: string
          format: date-time
          description: Time the attempt was made.
          example: "2024-01-01T00:00:05Z"
        code:
          type: string
          description: Response status code or error code.
          example: "200"
        response_data:
          type: object
          nullable: true
          description: Response data from the attempt. Only included when include=response_data.
          additionalProperties: true
          example: { "status_code": 200, "body": '{"status":"ok"}', "headers": { "content-type": "application/json" } }
        attempt_number:
          type: integer
          description: The attempt number (1 for first attempt, 2+ for retries).
          example: 1
        manual:
          type: boolean
          description: Whether this attempt was manually triggered (e.g., a retry initiated by a user).
          example: false
        latency_ms:
          type: integer
          nullable: true
          description: Time in milliseconds from sending the attempt to receiving the destination's response (or the error), measured around the provider's publish call. Null for attempts that never reached the provider and for attempts recorded before latency was tracked.
          example: 212
        event_id:
          type: string
          description: The ID of the associated event.
          example: "evt_123"
        destination_id:
          type: string
          description: The destination ID this attempt was sent to.
          example: "des_456"
        event:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/EventFull"
            - $ref: "#/components/schemas/EventSummary"
          description: The associated event object. Only present when include=event or include=event.data.
        destination:
          nullable: true
          $ref: "#/components/schemas/AttemptDestination"
          description: The destination object, without credentials. Only present when include=destination.
    EventSummary:
      type: object
      description: Event object without data (returned when include=event).
      properties:
        id:
          type: string
          example: "evt_123"
        tenant_id:
          type: string
          description: The tenant this event belongs to.
          example: "tnt_123"
        destination_id:
          type: string
          description: The destination this event was delivered to.
          example: "des_456"
        topic:
          type: string
          example: "user.created"
        time:
          type: string
          format: date-time
          description: Time the event was received.
          example: "2024-01-01T00:00:00Z"
        eligible_for_retry:
          type: boolean
          description: Whether this event can be retried.
          example: true
        schema_valid:
          type: boolean
          description: Result of publish-time validation of `data` against the topic's `payload_schema`. `true` when `data` passed, `false` when it failed in a topic whose `validation` is `warn`. Omitted when the event was not validated, because the topic's `validation` is `off` or `data` was over the validation size limit.
          example: true
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          example: { "source": "crm" }
    EventFull:
      type: object
      description: Full event object with data (returned when include=event.data).
      properties:
        id:
          type: string
          example: "evt_123"
        tenant_id:
          type: string
          description: The tenant this event belongs to.
          example: "tnt_123"
        destination_id:
          type: string
          description: The destination this event was delivered to.
          example: "des_456"
        topic:
          type: string
          example: "user.created"
        time:
          type: string
          format: date-time
          description: Time the event was received.
          example: "2024-01-01T00:00:00Z"
        eligible_for_retry:
          type: boolean
          description: Whether this event can be retried.
          example: true
        schema_valid:
          type: boolean
          description: Result of publish-time validation of `data` against the topic's `payload_schema`. `true` when `data` passed, `false` when it failed in a topic whose `validation` is `warn`. Omitted when the event was not validated, because the topic's `validation` is `off` or `data` was over the validation size limit.
          example: true
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          example: { "source": "crm" }
        data:
          type: object
          additionalProperties: true
          description: The event payload data.
          example: { "user_id": "userid", "status": "active" }
    AttemptPaginatedResult:
      type: object
      description: Paginated list of attempts.
      properties:
        pagination:
          $ref: "#/components/schemas/SeekPagination"
        models:
          type: array
          items:
            $ref: "#/components/schemas/Attempt"
          description: Array of attempt objects.
    EventPaginatedResult:
      type: object
      description: Paginated list of events.
      properties:
        pagination:
          $ref: "#/components/schemas/SeekPagination"
        models:
          type: array
          items:
            $ref: "#/components/schemas/Event"
          description: Array of event objects.

    # Destination Type Schema (for Metadata endpoint)
    DestinationType:
      type: string
      enum:
        - webhook
        - aws_sqs
        - rabbitmq
        - hookdeck
        - aws_kinesis
        - azure_servicebus
        - aws_s3
        - gcp_pubsub
        - kafka
        - cloudflare_queues
        - aws_eventbridge
        - mcp
      description: Type of destination. `mcp` destinations are MCP Events subscriptions, returned by API v2 only and never created through `POST /tenants/{tenant_id}/destinations`.
      example: "webhook"
    DestinationTypeSchema:
      type: object
      properties:
        type:
          type: string
          example: "webhook"
        label:
          type: string
          example: "Webhook"
        description:
          type: string
          example: "Send event via an HTTP POST request to a URL"
        icon:
          type: string
          description: SVG icon string.
          example: "<svg />"
        create_mode:
          type: string
          enum: [form, external]
          description: |
            How destinations of this type are created. With `form`, render a form from `config_fields` and `credential_fields` and submit it to `POST /tenants/{tenant_id}/destinations`. With `external`, the type can't be created from a form: show `instructions` in place of the form, and offer no submit step. `mcp` is the only `external` type.

            Returned by API v2 for every type. API v1 omits it.
          example: "form"
        instructions:
          type: string
          description: Markdown instructions. For an `external` type, the instructions to show in place of a create form. For `mcp`, they are filled in with `MCP_SERVER_URL` and the MCP-enabled topics.
          example: "Some *markdown*"
        setup_link:
          type: object
          # Property is optional, not nullable
          description: >-
            Some destinations may have an OAuth flow or other managed-setup flow that can be triggered with a link. If a `setup_link` is set then the user should be prompted to follow the link to configure the destination.

            See the [building your own UI guide](https://outpost.hookdeck.com/guides/building-your-own-ui.mdx) for recommended UI patterns and wireframes for implementation in your own app.
          properties:
            href:
              type: string
              format: url
              description: The URL to direct the user to for setup.
              example: "https://dashboard.hookdeck.com/connect"
            cta:
              type: string
              description: The call-to-action button text to display to the user.
              example: "Generate Hookdeck Token"
          required:
            - href
            - cta
        config_fields:
          type: array
          description: Config fields are non-secret values that can be stored and displayed to the user in plain text.
          items:
            $ref: "#/components/schemas/DestinationSchemaField"
        credential_fields:
          type: array
          description: Credential fields are secret values that will be AES encrypted and obfuscated to the user. Some credentials may not be obfuscated; the destination type dictates the obfuscation logic.
          items:
            $ref: "#/components/schemas/DestinationSchemaField"
    DestinationSchemaField:
      type: object
      required: [type, required, key]
      properties:
        key:
          type: string
          description: >-
            Property name for this value inside the destination `config` or `credentials` object
            on create/update (for example `url` for a webhook endpoint URL). This is the key used
            to store and retrieve the field value in the destination's config or credentials object.
          example: "url"
        type:
          type: string
          enum: [text, checkbox, key_value_map, select]
          example: "text"
        label:
          type: string
          example: "URL"
        description:
          type: string
          example: "The URL to send the event to"
        required:
          type: boolean
          example: true
        sensitive:
          type: boolean
          description: Indicates if the field contains sensitive information.
          example: false
        default:
          type: string
          description: Default value for the field.
          example: "default_value"
        minlength:
          type: integer
          description: Minimum length for a text input.
          example: 0
        maxlength:
          type: integer
          description: Maximum length for a text input.
          example: 255
        pattern:
          type: string
          description: Regex pattern for validation (compatible with HTML5 pattern attribute).
          example: "^[a-zA-Z0-9_]+$"
        options:
          type: array
          description: Available options for select fields.
          items:
            type: object
            required: [label, value]
            properties:
              label:
                type: string
                example: "PLAIN"
              value:
                type: string
                example: "plain"

    # Topic Schema (for Topics endpoint)
    TopicSchema:
      type: object
      description: A topic configured on the Outpost instance, with its schema configuration. A topic without a schema has only `name`, `validation` set to `off` and `mcp.enabled` set to `false`.
      required: [name, validation, mcp]
      properties:
        name:
          type: string
          description: The topic name, as listed in `TOPICS`.
          example: "order.created"
        description:
          type: string
          description: What the topic's events represent. Omitted when not configured.
          example: "Fires when a new order is placed."
        payload_schema:
          type: object
          additionalProperties: true
          description: JSON Schema (draft 2020-12) for the event `data`, as configured, including any `x-mcp-filter` annotations. Schemas imported from OpenAPI carry their referenced component schemas in `$defs`. Omitted when the topic has no schema.
          example:
            type: object
            properties:
              order_id:
                type: string
                x-mcp-filter: false
              total:
                type: number
                description: Order total in major units.
              currency:
                type: string
                description: ISO 4217 currency code.
            required: [order_id, total, currency]
        validation:
          type: string
          enum: ["off", "warn", "enforce"]
          description: Publish-time validation of event `data` against `payload_schema`. `off` skips it. `warn` accepts an invalid event and stores it with `schema_valid` set to `false`. `enforce` rejects it with `422`.
          example: "enforce"
        mcp:
          type: object
          description: The topic's MCP Events settings.
          required: [enabled]
          properties:
            enabled:
              type: boolean
              description: Whether the topic is exposed to MCP Events clients.
              example: true
        deprecated:
          type: boolean
          description: Whether the topic is deprecated. Publishing to a deprecated topic still works. Omitted when `false`.
          example: false
        replaced_by:
          type: string
          description: The topic that replaces this deprecated topic. Omitted when not set.
          example: "order.created.v2"

    # MCP Events Schemas (for the MCP endpoints)
    # The results of events/list and events/subscribe are forwarded verbatim to
    # MCP clients, so they and every pass-through field are free-form objects,
    # and their timestamps are plain strings: generated SDKs must not drop,
    # rename or reformat anything.
    MCPEvent:
      type: object
      additionalProperties: true
      description: One entry of the `events/list` result, built from a topic whose `mcp.enabled` is set.
      required: [name, delivery, inputSchema, payloadSchema]
      properties:
        name:
          type: string
          description: The event name, which is the topic name.
          example: "order.created"
        description:
          type: string
          description: >-
            The topic's `description`. For a deprecated topic, it starts with `Deprecated: use <replaced_by>.`, or `Deprecated.` when `replaced_by` isn't set. Omitted when the topic has no description.
          example: "Fires when a new order is placed."
        delivery:
          type: array
          items:
            type: string
          description: The delivery modes the event supports. Always `["webhook"]`.
          example: ["webhook"]
        inputSchema:
          type: object
          additionalProperties: true
          description: >-
            JSON Schema for the subscription `arguments`, inferred from the topic's `payload_schema`. Each filterable top-level property is an optional argument that takes a value, a list of 1 to 100 values, or, for numbers and `format: date` strings, an object of `$gt`, `$gte`, `$lt` and `$lte`. Unknown arguments fail validation. See [MCP subscription arguments](https://hookdeck.com/docs/outpost/features/topics#mcp-subscription-arguments).
        payloadSchema:
          type: object
          additionalProperties: true
          description: The topic's `payload_schema` without its `x-mcp-filter` annotations. It describes the `data` of every delivered event.
      example:
        name: "order.created"
        description: "Fires when a new order is placed."
        delivery: ["webhook"]
        inputSchema:
          type: object
          properties:
            total:
              description: Order total in major units.
              anyOf:
                - type: number
                - type: array
                  items:
                    type: number
                  minItems: 1
                  maxItems: 100
                - type: object
                  properties:
                    $gt:
                      type: number
                    $gte:
                      type: number
                    $lt:
                      type: number
                    $lte:
                      type: number
                  additionalProperties: false
                  minProperties: 1
            currency:
              description: ISO 4217 currency code.
              anyOf:
                - type: string
                  maxLength: 256
                - type: array
                  items:
                    type: string
                    maxLength: 256
                  minItems: 1
                  maxItems: 100
          additionalProperties: false
        payloadSchema:
          type: object
          properties:
            order_id:
              type: string
            total:
              type: number
              description: Order total in major units.
            currency:
              type: string
              description: ISO 4217 currency code.
            created_at:
              type: string
              format: date-time
          required: [order_id, total, currency]
    MCPEventList:
      type: object
      additionalProperties: true
      description: The `events/list` result. Return it to the MCP client unchanged.
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/MCPEvent"
          description: The MCP-enabled topics on this page, in `TOPICS` order.
        nextCursor:
          type: string
          description: Opaque cursor for the next page, to pass back as `cursor`. Omitted when there are no more pages, as in MCP's `PaginatedResult`.
          example: "dDpvcmRlci5jcmVhdGVk"
    MCPSubscribeRequest:
      type: object
      required: [principal, params]
      properties:
        principal:
          type: string
          minLength: 1
          description: |
            The authenticated subject of the MCP request, such as an OAuth `sub`, as resolved by your MCP server. 1 to 512 bytes.

            It is part of the subscription key, and callback verification is cached per tenant, principal and callback URL, so it must identify one subject within the tenant.
          example: "user_8f2c"
        params:
          type: object
          additionalProperties: true
          description: |
            The `params` of the `events/subscribe` request, passed through unchanged:

            - `name` (required): the event name, an MCP-enabled topic.
            - `arguments`: an object matching the event's `inputSchema`, up to 4 KiB as canonical JSON. Defaults to `{}`.
            - `delivery.mode`: absent or `webhook`. Any other value fails with `unsupported`.
            - `delivery.url` (required): the `https` callback URL, at most 2048 bytes once normalized, with no credentials or fragment.
            - `delivery.secret` (required): `whsec_` followed by the standard base64 encoding, padded or not, of 24 to 64 bytes.
            - `ttlMs`: the suggested lifetime in milliseconds. Absent grants `MCP_TTL_DEFAULT`. A number is rounded down and clamped to `MCP_TTL_MIN` and `MCP_TTL_MAX`, so a negative value grants the minimum. `null` requests no expiry, granted only with `MCP_ALLOW_NO_EXPIRY=true`, else `MCP_TTL_MAX`. Any other type fails with `invalid_params`.

            `cursor`, `maxAgeMs` and unknown fields are ignored.
          example:
            name: "order.created"
            arguments:
              total:
                $gte: 100
              currency: "USD"
            delivery:
              mode: "webhook"
              url: "https://receiver.example.com/mcp-events/abc123"
              secret: "whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw"
            cursor: null
        filter:
          type: object
          additionalProperties: true
          description: |
            Optional. A [destination filter](https://hookdeck.com/docs/outpost/features/filter) that replaces the filter Outpost generates from `params.arguments`, for logic the arguments can't express. It matches the whole event, so payload fields sit under `data`. Up to 8 KiB as canonical JSON.

            It's applied on every subscribe call: a refresh without it switches the subscription back to the generated filter.
          example:
            data:
              total:
                $gte: 100
              currency:
                $in: ["USD", "CAD"]
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Optional key-value pairs stored as the subscription destination's `metadata`. A refresh without it keeps the stored metadata.
          example:
            plugin: "chatgpt"
        allowed_topics:
          type: array
          items:
            type: string
          description: >-
            Optional. The event names this principal may subscribe to, from your own authorization. When set, a `params.name` outside it fails with `not_found` (`{"kind": "event"}`), the same error as an unknown event, so the response doesn't reveal that the event exists.
          example: ["order.created", "order.shipped"]
    MCPUnsubscribeRequest:
      type: object
      required: [principal, params]
      properties:
        principal:
          type: string
          minLength: 1
          description: The authenticated subject of the MCP request, as passed to the subscribe endpoint.
          example: "user_8f2c"
        params:
          type: object
          additionalProperties: true
          description: The `params` of the `events/unsubscribe` request, passed through unchanged. Outpost reads `name`, `arguments` (default `{}`) and `delivery.url`, and ignores every other field, including `delivery.mode` and `delivery.secret`.
          example:
            name: "order.created"
            arguments:
              total:
                $gte: 100
              currency: "USD"
            delivery:
              url: "https://receiver.example.com/mcp-events/abc123"
    MCPSubscribeResult:
      type: object
      additionalProperties: true
      description: The `events/subscribe` result. Return it to the MCP client unchanged.
      required: [id, refreshBefore, cursor, truncated]
      properties:
        id:
          type: string
          description: The subscription ID, `sub_` followed by the first 32 hex characters of the SHA-256 of the canonical JSON of `{arguments, name, principal, url}`. It's stable across refreshes and is sent as `X-MCP-Subscription-Id` on every delivery.
          example: "sub_1fa69bec3707ee16223ae5400f92f935"
        refreshBefore:
          type: string
          nullable: true
          description: >-
            When the subscription expires unless the client subscribes again, as an RFC 3339 UTC timestamp truncated to the second. Always present. `null` only when the client sent `ttlMs: null` and `MCP_ALLOW_NO_EXPIRY` is `true`.
          example: "2026-10-09T18:00:00Z"
        cursor:
          type: string
          nullable: true
          description: Always `null`. Outpost doesn't replay events.
          example: null
        truncated:
          type: boolean
          description: Always `false`.
          example: false
        deliveryStatus:
          type: object
          additionalProperties: true
          description: |
            Present only when the call refreshed a live subscription, and omitted if Outpost can't read the subscription's status record. The record is written by the log service as it records delivery attempts.

            - `active`: `false` when the subscription had been auto-disabled after repeated failures. The refresh that returns it has re-enabled the subscription and resumed its pending retries.
            - `lastDeliveryAt`: when the last successful delivery was made, as an RFC 3339 UTC timestamp, or `null`.
            - `lastError`: when the last attempt failed, its category: `connection_refused`, `timeout`, `tls_error`, `http_4xx` or `http_5xx`. Otherwise `null`. It never contains response content.
          example:
            active: true
            lastDeliveryAt: "2026-10-09T16:58:12Z"
            lastError: null
    MCPEmptyResult:
      type: object
      additionalProperties: true
      description: The `events/unsubscribe` result, always the empty object `{}`. Return it to the MCP client unchanged.
      example: {}
    MCPSubscription:
      type: object
      description: An MCP Events subscription, as listed for you rather than for MCP clients.
      required: [id, principal, event, url, created_at]
      properties:
        id:
          type: string
          description: The subscription ID, also the destination ID.
          example: "sub_1fa69bec3707ee16223ae5400f92f935"
        principal:
          type: string
          example: "user_8f2c"
        event:
          type: string
          description: The subscribed event name.
          example: "order.created"
        arguments:
          type: object
          additionalProperties: true
          description: The subscription arguments.
          example:
            total:
              $gte: 100
            currency: "USD"
        url:
          type: string
          description: The callback URL, normalized.
          example: "https://receiver.example.com/mcp-events/abc123"
        filter:
          type: object
          additionalProperties: true
          nullable: true
          description: The destination filter, generated from `arguments` or passed as `filter` on subscribe.
          example:
            data:
              total:
                $gte: 100
              currency: "USD"
        expires_at:
          type: string
          nullable: true
          description: When the subscription expires, as an RFC 3339 timestamp. `null` when it was granted no expiry.
          example: "2026-10-09T18:00:00.123Z"
        created_at:
          type: string
          description: When the subscription was created, as an RFC 3339 timestamp. A refresh keeps it.
          example: "2026-10-09T17:00:00Z"
        updated_at:
          type: string
          description: When the subscription was last updated, as an RFC 3339 timestamp.
          example: "2026-10-09T17:00:00Z"
        disabled_at:
          type: string
          nullable: true
          description: When the subscription was auto-disabled, as an RFC 3339 timestamp, or `null` when it is enabled.
          example: null
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: The `metadata` passed on subscribe.
          example:
            plugin: "chatgpt"
    MCPSubscriptionsDeleteResult:
      type: object
      required: [success, deleted]
      properties:
        success:
          type: boolean
          example: true
        deleted:
          type: integer
          description: The number of subscriptions deleted.
          example: 3
    MCPErrorDetail:
      type: object
      additionalProperties: true
      description: An MCP Events error, ready to rethrow as a JSON-RPC error.
      required: [kind, code, message]
      properties:
        kind:
          type: string
          description: |
            The error kind, stable across `MCP_ERROR_CODES` profiles: `invalid_params`, `not_found`, `resource_exhausted`, `unsupported` or `callback_endpoint_error`. New kinds may be added.
          example: "callback_endpoint_error"
        code:
          type: integer
          description: The JSON-RPC error code for `kind` under the configured `MCP_ERROR_CODES` profile.
          example: -32015
        message:
          type: string
          description: The error name, such as `InvalidParams` or `CallbackEndpointError`.
          example: "CallbackEndpointError"
        data:
          type: object
          additionalProperties: true
          description: |
            Details whose shape depends on `kind`:

            - `invalid_params`: `{field, reason, errors?}`. `field` names the request field, such as `arguments`, `delivery.url`, `delivery.secret`, `ttlMs`, `principal` or `cursor`. `reason` is a fixed code, such as `address_not_allowed`, `https_required` or `invalid_url` for `delivery.url`. `errors` lists argument validation errors as paths and messages, such as `arguments.total: must be number`, without the submitted values.
            - `not_found`: `{kind}`, where `kind` is `event`, `tenant` or `subscription`.
            - `resource_exhausted`: `{limit, max?, retryAfterMs?}`. `limit` is `subscriptions` (`MAX_MCP_SUBSCRIPTIONS_PER_TENANT`), `principal_subscriptions` (`MAX_MCP_SUBSCRIPTIONS_PER_PRINCIPAL`) or `verification_rate`.
            - `unsupported`: `{feature, value}`, such as `{"feature": "deliveryMode", "value": "poll"}`, or `{"feature": "payloadSchema", "reason": "schema_changed"}` for a refresh of a subscription a forced breaking schema change ended.
            - `callback_endpoint_error`: `{reason}`, one of `connection_refused`, `timeout`, `tls_error`, `http_4xx`, `http_5xx` and `challenge_failed`.
          example:
            reason: "challenge_failed"
    MCPErrorResponse:
      type: object
      description: The body of an MCP failure (`422`) from an MCP endpoint.
      required: [mcp_error]
      properties:
        mcp_error:
          $ref: "#/components/schemas/MCPErrorDetail"

    MetricsDataPoint:
      type: object
      properties:
        time_bucket:
          type: string
          format: date-time
          description: Start of the time bucket. Absent when no granularity is specified.
          example: "2026-03-02T14:00:00Z"
        dimensions:
          type: object
          additionalProperties:
            type: string
          description: Dimension values for this data point. Empty object when no dimensions are requested.
          example:
            destination_id: "dest_abc"
            topic: "user.created"
        metrics:
          type: object
          additionalProperties: {}
          description: Requested measure values for this data point.
          example:
            count: 1423
            error_rate: 0.02

    MetricsMetadata:
      type: object
      properties:
        granularity:
          type: string
          description: The granularity used for time bucketing. Absent when none was specified.
          example: "1h"
        query_time_ms:
          type: integer
          description: Query execution time in milliseconds.
          example: 42
        row_count:
          type: integer
          description: Number of data points returned.
          example: 2
        row_limit:
          type: integer
          description: Maximum number of rows the query will return.
          example: 100000
        truncated:
          type: boolean
          description: Whether the results were truncated due to hitting the row limit.
          example: false

    MetricsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MetricsDataPoint"
          description: Array of aggregated data points.
        metadata:
          $ref: "#/components/schemas/MetricsMetadata"


    ManagedConfig:
      type: object
      description: |
        Configuration values for managed Outpost.
        This API is only available on managed Outpost.
        Self-hosted deployments configure these values using environment variables.
      properties:
        ALERT_AUTO_DISABLE_DESTINATION:
          type: string
          description: >-
            If "true", automatically disables a destination once
            ALERT_CONSECUTIVE_FAILURE_COUNT is reached. Has no effect when
            consecutive-failure alerting is disabled.
        ALERT_CONSECUTIVE_FAILURE_COUNT:
          type: string
          description: >-
            Consecutive delivery failures before alerting on a destination (and
            disabling it when ALERT_AUTO_DISABLE_DESTINATION is "true"). Omit for
            the default of 100; set to an empty string to disable
            consecutive-failure alerting entirely.
        ALERT_EXHAUSTED_RETRIES_WINDOW_SECONDS:
          type: string
          description: >-
            Suppression window in seconds for exhausted_retries alerts: the first
            exhaustion per destination alerts and subsequent ones within the
            window are suppressed ("0" = no suppression). Omit for the default of
            3600; set to an empty string to disable exhausted_retries alerting
            entirely.
        DELIVERY_TIMEOUT_SECONDS:
          type: string
        DESTINATIONS_AWS_KINESIS_METADATA_IN_PAYLOAD:
          type: string
        DESTINATIONS_INCLUDE_MILLISECOND_TIMESTAMP:
          type: string
        DESTINATIONS_WEBHOOK_COMPAT_HEADERS:
          type: string
          description: >-
            Additional headers sent with the compat signature, as comma-separated
            "name=template" pairs. Available variables: {{.EventID}}, {{.Topic}},
            {{.Timestamp}}. Use "\," for a literal comma in a template.
        DESTINATIONS_WEBHOOK_COMPAT_SIGNATURE_ALGORITHM:
          type: string
          description: >-
            Algorithm for the compat signature. Defaults to "hmac-sha256".
        DESTINATIONS_WEBHOOK_COMPAT_SIGNATURE_CONTENT_TEMPLATE:
          type: string
          description: >-
            Go template for the content signed by the compat signature. Same
            variables as DESTINATIONS_WEBHOOK_SIGNATURE_CONTENT_TEMPLATE.
            Defaults to "{{.Body}}".
        DESTINATIONS_WEBHOOK_COMPAT_SIGNATURE_ENCODING:
          type: string
          description: >-
            Encoding for the compat signature ("hex" or "base64"). Defaults to
            "hex".
        DESTINATIONS_WEBHOOK_COMPAT_SIGNATURE_HEADER_NAME:
          type: string
          description: >-
            Complete name of the compat signature header. Setting it sends a
            second signature, in a previous scheme, alongside the primary one.
        DESTINATIONS_WEBHOOK_COMPAT_SIGNATURE_HEADER_TEMPLATE:
          type: string
          description: >-
            Go template for the value of the compat signature header. Same
            variables as DESTINATIONS_WEBHOOK_SIGNATURE_HEADER_TEMPLATE.
            Defaults to "v0={{.Signatures | join ","}}".
        DESTINATIONS_WEBHOOK_COMPAT_SIGNATURE_SECRET_ENCODING:
          type: string
          description: >-
            How the compat signature derives its HMAC key from the destination
            secret: "raw", "base64" or "hex". Defaults to "raw". A destination
            whose secret can't be decoded doesn't receive the compat signature.
        DESTINATIONS_WEBHOOK_COMPAT_SIGNATURE_SECRET_PREFIX:
          type: string
          description: >-
            Prefix stripped from the destination secret before decoding for the
            compat signature (e.g., "whsec_").
        DESTINATIONS_WEBHOOK_EVENT_ID_HEADER_NAME:
          type: string
          description: >-
            Complete name of the event ID header. Unset uses the default
            "<prefix>event-id"; an explicit value pins that exact name; an empty
            string disables the header. Only applies to "default" mode.
        DESTINATIONS_WEBHOOK_HEADER_PREFIX:
          type: string
        DESTINATIONS_WEBHOOK_MODE:
          type: string
        DESTINATIONS_WEBHOOK_PROXY_URL:
          type: string
        DESTINATIONS_WEBHOOK_SIGNATURE_ALGORITHM:
          type: string
        DESTINATIONS_WEBHOOK_SIGNATURE_CONTENT_TEMPLATE:
          type: string
        DESTINATIONS_WEBHOOK_SIGNATURE_ENCODING:
          type: string
        DESTINATIONS_WEBHOOK_SIGNATURE_HEADER_NAME:
          type: string
          description: >-
            Complete name of the signature header. Unset uses the default
            "<prefix>signature"; an explicit value pins that exact name; an
            empty string disables the header. Only applies to "default" mode.
        DESTINATIONS_WEBHOOK_SIGNATURE_HEADER_TEMPLATE:
          type: string
        DESTINATIONS_WEBHOOK_SIGNATURE_SECRET_ENCODING:
          type: string
          description: >-
            How the signature derives its HMAC key from the destination secret:
            "raw" uses the secret as-is, "base64" and "hex" decode it. Defaults
            to "raw". DESTINATIONS_WEBHOOK_SIGNING_SECRET_TEMPLATE must generate
            secrets this encoding can decode. Only applies to "default" mode.
        DESTINATIONS_WEBHOOK_SIGNATURE_SECRET_PREFIX:
          type: string
          description: >-
            Prefix stripped from the destination secret before decoding (e.g.,
            "whsec_"). Ignored when DESTINATIONS_WEBHOOK_SIGNATURE_SECRET_ENCODING
            is "raw". Only applies to "default" mode.
        DESTINATIONS_WEBHOOK_SIGNING_SECRET_TEMPLATE:
          type: string
        DESTINATIONS_WEBHOOK_TIMESTAMP_FORMAT:
          type: string
          description: >-
            Format of the timestamp header: "rfc3339", "unix" (seconds since the
            epoch) or "iso8601_milli_no_offset" (UTC with milliseconds and no
            offset, e.g. "2026-10-05T15:02:25.447"). Defaults to "rfc3339".
            Only applies to "default" mode.
        DESTINATIONS_WEBHOOK_TIMESTAMP_HEADER_NAME:
          type: string
          description: >-
            Complete name of the timestamp header. Unset uses the default
            "<prefix>timestamp"; an explicit value pins that exact name; an
            empty string disables the header. Only applies to "default" mode.
        DESTINATIONS_WEBHOOK_TOPIC_HEADER_NAME:
          type: string
          description: >-
            Complete name of the topic header. Unset uses the default
            "<prefix>topic"; an explicit value pins that exact name; an empty
            string disables the header. Only applies to "default" mode.
        HTTP_USER_AGENT:
          type: string
        IDGEN_ATTEMPT_PREFIX:
          type: string
        IDGEN_DESTINATION_PREFIX:
          type: string
        IDGEN_EVENT_PREFIX:
          type: string
        IDGEN_TYPE:
          type: string
        MAX_DESTINATIONS_PER_TENANT:
          type: string
        PORTAL_BRAND_COLOR:
          type: string
        PORTAL_DISABLE_OUTPOST_BRANDING:
          type: string
        PORTAL_FAVICON_URL:
          type: string
        PORTAL_FORCE_THEME:
          type: string
        PORTAL_LOGO:
          type: string
        PORTAL_LOGO_DARK:
          type: string
        PORTAL_ORGANIZATION_NAME:
          type: string
        PORTAL_REFERER_URL:
          type: string
        PORTAL_REFRESH_URL:
          type: string
        PORTAL_ENABLE_DESTINATION_FILTER:
          type: string
        PORTAL_ENABLE_WEBHOOK_CUSTOM_HEADERS:
          type: string
        RETRY_INTERVAL_SECONDS:
          type: string
        MAX_RETRY_LIMIT:
          type: string
        RETRY_SCHEDULE:
          type: string
        OTEL_EXPORTER_OTLP_ENDPOINT:
          type: string
        OTEL_EXPORTER_OTLP_HEADERS:
          type: string
        OTEL_EXPORTER_OTLP_PROTOCOL:
          type: string
        OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:
          type: string
        OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:
          type: string
        OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:
          type: string
        OTEL_SERVICE_NAME:
          type: string
        PUBLISH_AWS_SQS_ACCESS_KEY_ID:
          type: string
        PUBLISH_AWS_SQS_ENDPOINT:
          type: string
        PUBLISH_AWS_SQS_QUEUE:
          type: string
        PUBLISH_AWS_SQS_REGION:
          type: string
        PUBLISH_AWS_SQS_SECRET_ACCESS_KEY:
          type: string
        PUBLISH_AZURE_SERVICEBUS_CONNECTION_STRING:
          type: string
        PUBLISH_AZURE_SERVICEBUS_SUBSCRIPTION:
          type: string
        PUBLISH_AZURE_SERVICEBUS_TOPIC:
          type: string
        PUBLISH_GCP_PUBSUB_PROJECT:
          type: string
        PUBLISH_GCP_PUBSUB_SERVICE_ACCOUNT_CREDENTIALS:
          type: string
        PUBLISH_GCP_PUBSUB_SUBSCRIPTION:
          type: string
        PUBLISH_GCP_PUBSUB_TOPIC:
          type: string
        PUBLISH_RABBITMQ_EXCHANGE:
          type: string
        PUBLISH_RABBITMQ_QUEUE:
          type: string
        PUBLISH_RABBITMQ_SERVER_URL:
          type: string
        TOPICS:
          type: string
        TOPICS_ALLOW_WILDCARDS:
          type: string
      additionalProperties: false
      example:
        TOPICS: "user.created,user.updated"
        DESTINATIONS_WEBHOOK_MODE: "default"

    # Operator Events (managed only)
    OperatorEventDestinationCreate:
      type: object
      required: [type, topics, config]
      properties:
        type:
          type: string
          description: >-
            Type of the destination. `GET /operator-events/destination-types` lists the types
            this deployment accepts and the `config` and `credentials` fields each one takes.
          example: "webhook"
        topics:
          type: array
          items:
            type: string
          description: >-
            Operator event topics to subscribe to. Use `["*"]` to subscribe to every topic. See
            the Operator Events tag description for the available topics.
          example: ["alert.destination.disabled", "alert.destination.consecutive_failure"]
        config:
          type: object
          additionalProperties:
            type: string
          description: >-
            Configuration for the chosen destination type, with the same fields as a tenant
            destination of that type. Send `{}` for a type with no config fields.
          example: { "url": "https://alerts.acme.com/outpost" }
        credentials:
          type: object
          additionalProperties:
            type: string
          description: >-
            Credentials for the chosen destination type, with the same fields as a tenant
            destination of that type. For `webhook` this is optional: set `secret` to supply the
            signing secret, or omit it and Outpost generates one.
          example: { "secret": "whsec_abc123" }
    OperatorEventDestinationUpdate:
      type: object
      description: Fields to change. Omitted fields are left as they are.
      properties:
        topics:
          type: array
          items:
            type: string
          description: >-
            Replacement list of operator event topics. Use `["*"]` to subscribe to every topic.
            Full-replacement semantics: the list sent becomes the subscription.
          example: ["alert.destination.disabled", "alert.attempt.exhausted_retries"]
        config:
          type: object
          additionalProperties: true
          description: >-
            Config fields to change for the destination's type. Merge-patch semantics: fields
            that are not sent keep their value.
          example: { "url": "https://alerts.acme.com/outpost" }
        credentials:
          type: object
          additionalProperties: true
          description: >-
            Credential fields to change for the destination's type. Merge-patch semantics:
            fields that are not sent keep their value. For `webhook`, set `secret` to replace
            the signing secret, or send `rotate_secret: true` to have Outpost generate a new one
            and keep the current one valid as `previous_secret`.
          example: { "rotate_secret": true }
    OperatorEventRetryRequest:
      type: object
      required: [event_id, destination_id]
      properties:
        event_id:
          type: string
          description: The ID of the operator event to redeliver.
          example: "F1JKYUvykB5grOoE6Bnm6jztlF"
        destination_id:
          type: string
          description: The ID of the operator event destination to redeliver it to.
          example: "des_12345"

# Security is applied per-operation based on AuthScope

# `x-outpost-deployment` marks an operation or tag that exists in only one
# deployment model: `managed` or `self-hosted`. **Its absence means the
# operation is available in both** — the key is present only where
# availability is restricted, so adding an endpoint that works everywhere
# needs nothing here.
#
# It carries the same fact as the "only available for..." sentences in the
# descriptions beside it, in a form a generator, a validator or an agent can
# read without parsing English. The prose stays, because it is what a human
# reading the reference sees.
tags:
  - name: Health
    x-outpost-deployment: self-hosted
    description: |
      This endpoint is only available for **self-hosted** Outpost deployments. Managed Outpost health is monitored by Hookdeck.
  - name: Configuration
    x-outpost-deployment: managed
    description: |
      The Configuration API is only available on managed Outpost. It allows you to read and update instance-level settings, the same settings available as environment variables in self-hosted deployments.
  - name: Operator Events
    x-outpost-deployment: managed
    description: |
      Operator events are Outpost's own lifecycle and alerting stream: delivery failures, destinations being auto-disabled, retry exhaustion and tenant subscription changes. They are about the deployment, not about a tenant's traffic, so they are delivered to **operator event destinations** rather than to tenant destinations. An operator event destination is deployment-wide, is not owned by any tenant you create, and has the same shape as a tenant destination: any destination type listed by `GET /operator-events/destination-types`, with that type's `config` and `credentials`.

      The Operator Events API is only available on managed Outpost, and requires the Admin API Key. Self-hosted deployments configure the same thing through environment variables and a single sink. See the [Operator Events](https://hookdeck.com/docs/outpost/features/operator-events) feature page.

      **Available topics**

      | Topic | Trigger |
      |-------|---------|
      | `alert.destination.consecutive_failure` | Consecutive failure count reaches 50%, 70%, 90%, or 100% of `ALERT_CONSECUTIVE_FAILURE_COUNT` |
      | `alert.destination.disabled` | Destination auto-disabled at the 100% failure threshold |
      | `alert.attempt.exhausted_retries` | Delivery exhausts all retry attempts |
      | `attempt.success` | Every successful delivery attempt |
      | `attempt.failed` | Every failed delivery attempt, including retries |
      | `tenant.subscription.updated` | A destination was created, updated or deleted and the tenant's topics or destination count changed |
      | `mcp.subscription.expired` | An MCP Events subscription reached its `expires_at` without a refresh and Outpost deleted it |

      A destination may subscribe to every topic with `["*"]`, but `attempt.success` and `attempt.failed` fire once per delivery attempt and will dominate volume. Prefer an explicit topic list.

      **Topics are derived from these destinations.** The union of every enabled operator event destination's `topics` is what the deployment subscribes to, which is why `PATCH /config` rejects `OPERATOR_EVENTS_TOPICS` with a 422: change the destinations and the configuration follows.
  - name: Tenants
    description: |
      The API segments resources per `tenant`. A tenant represents a user/team/organization in your product. The provided value determines the tenant's ID, which can be any string representation.

      If your system is not multi-tenant, create a single tenant with a hard-code tenant ID upon initialization. If your system has a single tenant but multiple environments, create a tenant per environment, like `live` and `test`.
  - name: Destinations
    description: |
      Destinations are the endpoints where events are sent. Each destination is associated with a tenant and can be configured to receive specific event topics.

      The `topics` array can contain either a list of topics or a wildcard `*` implying that all topics are supported. If you do not wish to implement topics for your application, you set all destination topics to `*`.

      By default all destination `credentials` are obfuscated and the values cannot be read. This does not apply to the `webhook` type destination secret and each destination can expose their own obfuscation logic.

      Destinations of type `mcp` are [MCP Events subscriptions](https://hookdeck.com/docs/outpost/destinations/mcp). They are created, refreshed and deleted through the MCP endpoints, so these endpoints can read and enable them but not create, update, disable or delete them. API v1 leaves them out entirely.
  - name: MCP
    x-outpost-deployment: self-hosted
    description: |
      The MCP endpoints back the [MCP Events](https://hookdeck.com/docs/outpost/guides/mcp-events) methods of your MCP server. Your MCP server authenticates each MCP request, resolves its principal and tenant, and forwards `events/list`, `events/subscribe` and `events/unsubscribe` to the first three endpoints. Each returns the MCP result to send back unchanged, or `422` with an `mcp_error` to rethrow as the JSON-RPC error. The other three endpoints are for you, not for MCP clients: list subscriptions, and end them when access is revoked.

      A subscription is a destination of type `mcp` whose ID is derived from the principal, the callback URL, the event name and the arguments. See [MCP destination](https://hookdeck.com/docs/outpost/destinations/mcp) for how events are delivered.

      These endpoints are only served by API v2 (`/api/v2`). Managed Outpost doesn't serve API v2 yet.

      **Errors**

      An MCP failure returns `422` with the body `{"mcp_error": {"kind", "code", "message", "data"}}`. `kind` is stable. `code` depends on `MCP_ERROR_CODES`, and `message` is the error name.

      | `kind` | `message` | `code` (`sketch`, the default) | `code` (`sep-3415`) | `data` |
      |--------|-----------|--------------------------------|---------------------|--------|
      | `invalid_params` | `InvalidParams` | `-32602` | `-32602` | `{field, reason, errors?}` |
      | `not_found` | `NotFound` | `-32011` | `-32023` | `{kind: "event" \| "tenant" \| "subscription"}` |
      | `resource_exhausted` | `ResourceExhausted` | `-32013` | `-32025` | `{limit: "subscriptions" \| "principal_subscriptions" \| "verification_rate", max?, retryAfterMs?}` |
      | `unsupported` | `Unsupported` | `-32014` | `-32026` | `{feature, value}` |
      | `callback_endpoint_error` | `CallbackEndpointError` | `-32015` | `-32027` | `{reason}`: `connection_refused`, `timeout`, `tls_error`, `http_4xx`, `http_5xx` or `challenge_failed` |

      The endpoints never return `Forbidden` (`-32012`, or `-32024` with `sep-3415`): your MCP server authorizes the principal before calling them. Outpost uses that code only in the `terminated` envelope it sends when you revoke a subscription.

      `mcp_error` never contains callback response content, resolved addresses or published values. A callback host that doesn't resolve, resolves to an address that isn't allowed, or can't be checked returns the same `invalid_params` error, `{"field": "delivery.url", "reason": "address_not_allowed"}`, so the response can't be used to probe internal hosts.
  - name: Publish
    description: Use the Publish endpoint to send events into Outpost. Events are matched against all destinations whose topic subscriptions and filters match the event. Requires Admin API Key.
  - name: Retry
    description: Triggers a retry for delivering an event to a destination. The event must exist, and the destination must be enabled, match the event's topic and filter, and already have a delivery attempt for the event.
  - name: Schemas
    description: |
      Destination types describe the available event delivery targets and their configuration schemas. Use these endpoints to render UI forms and list available destination types with their configuration schemas.
  - name: Topics
    description: |
      Returns the list of topics configured for this Outpost deployment. Tenants subscribe their destinations to topics from this list. Topics are defined via your configuration file and not a specific Create Topic API.

      In API v2, each topic comes with its schema configuration: a description, a JSON Schema for the event `data`, the publish-time validation mode and the MCP Events opt-in. See [Topics](https://hookdeck.com/docs/outpost/features/topics#topic-schemas).
  - name: Attempts
    description: |
      Attempts represent individual delivery attempts of events to destinations. The attempts API provides an attempt-centric view of event processing.

      Use the `include` query parameter to include related data:
      - `include=event`: Include event summary (id, topic, time, eligible_for_retry, schema_valid, metadata)
      - `include=event.data`: Include full event with payload data
      - `include=response_data`: Include response body and headers from the attempt
      - `include=destination`: Include the destination object with target information, without credentials
  - name: Events
    description: |
      An event represents a payload published to Outpost. Events are matched against all destinations whose topic subscriptions match the event topic, then delivered.
  - name: Metrics
    description: |
      Aggregated metrics for events and delivery attempts. Supports time bucketing, dimensional grouping, and filtering.

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Health Check
      description: |
        Health check endpoint that reports the status of all workers.

        > This endpoint is only available for **self-hosted** Outpost deployments. Managed Outpost health is monitored by Hookdeck.

        Worker status is one of:
        - `healthy`: running.
        - `degraded`: failing and being restarted, within its restart budget. The service keeps serving. Only reported for workers listed in `SUPERVISOR_RESTART_WORKERS`.
        - `failed`: failed, or failing past its restart budget. With restarts enabled, Outpost keeps restarting it, and it returns to `healthy` once it recovers.

        Returns HTTP 200 when no worker has failed (the overall status is `degraded` if any worker is degraded), or HTTP 503 if any worker has failed.

        Note: Error details are not exposed for security reasons. Check application logs for detailed error information.
      operationId: healthCheck
      x-outpost-deployment: self-hosted
      security: []
      responses:
        "200":
          description: Service is healthy or degraded - no worker has failed.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - timestamp
                  - workers
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded]
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
                    description: When this health check was performed
                    example: "2025-11-11T10:30:00Z"
                  workers:
                    type: object
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum: [healthy, degraded]
                          example: healthy
                        since:
                          type: string
                          format: date-time
                          description: Start of the worker's current failure episode. Present when the status is `degraded` or `failed`.
                          example: "2025-11-11T10:29:45Z"
                        reason:
                          type: string
                          enum: [startup_failed, recovery_failed]
                          description: |
                            Present when the status is `degraded` or `failed`.
                            `startup_failed`: the worker has not been healthy since the process started (usually configuration or a dependency that is not up yet).
                            `recovery_failed`: the worker was healthy and then failed (e.g. a broker restart or failover).
                          example: recovery_failed
              example:
                status: degraded
                timestamp: "2025-11-11T10:30:00Z"
                workers:
                  http-server:
                    status: healthy
                  publishmq-consumer:
                    status: degraded
                    since: "2025-11-11T10:29:45Z"
                    reason: recovery_failed
        "503":
          description: Service is unhealthy - one or more workers have failed.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - timestamp
                  - workers
                properties:
                  status:
                    type: string
                    enum: [failed]
                    example: failed
                  timestamp:
                    type: string
                    format: date-time
                    description: When this health check was performed
                    example: "2025-11-11T10:30:15Z"
                  workers:
                    type: object
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum: [healthy, degraded, failed]
                          example: failed
                        since:
                          type: string
                          format: date-time
                          description: Start of the worker's current failure episode. Present when the status is `degraded` or `failed`.
                          example: "2025-11-11T10:29:45Z"
                        reason:
                          type: string
                          enum: [startup_failed, recovery_failed]
                          description: |
                            Present when the status is `degraded` or `failed`.
                            `startup_failed`: the worker has not been healthy since the process started (usually configuration or a dependency that is not up yet).
                            `recovery_failed`: the worker was healthy and then failed (e.g. a broker restart or failover).
                          example: recovery_failed
              example:
                status: failed
                timestamp: "2025-11-11T10:30:15Z"
                workers:
                  http-server:
                    status: healthy
                  publishmq-consumer:
                    status: failed
                    since: "2025-11-11T10:29:44Z"
                    reason: startup_failed
  /config:
    get:
      tags: [Configuration]
      summary: Get Managed Configuration
      description: |
        Returns managed Outpost configuration values.

        This endpoint is only available on managed Outpost.
        In self-hosted deployments, configuration is controlled through environment variables instead.
      operationId: getManagedConfig
      x-outpost-deployment: managed
      responses:
        "200":
          description: Managed configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedConfig"
              example:
                TOPICS: "user.created,user.updated"
                TOPICS_ALLOW_WILDCARDS: "false"
                DESTINATIONS_WEBHOOK_MODE: "default"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Configuration]
      summary: Update Managed Configuration
      description: |
        Updates one or more managed Outpost configuration values. Null values clear the configuration and reverts to Outpost default behavior.

        This endpoint is only available on managed Outpost.
        In self-hosted deployments, configuration is controlled through environment variables instead.

        Only the supported configuration keys are accepted.
      operationId: updateManagedConfig
      x-outpost-deployment: managed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedConfig"
            example:
              TOPICS: "user.created,user.updated"
              TOPICS_ALLOW_WILDCARDS: "false"
              DESTINATIONS_WEBHOOK_MODE: "default"
      responses:
        "200":
          description: Updated managed configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedConfig"
              example:
                TOPICS: "user.created,user.updated"
                TOPICS_ALLOW_WILDCARDS: "false"
                DESTINATIONS_WEBHOOK_MODE: "default"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  # Operator Events
  /operator-events/destination-types:
    get:
      tags: [Operator Events]
      summary: List Operator Event Destination Type Schemas
      description: |
        Returns the destination types an operator event destination may use, with the `config`
        and `credentials` fields each type takes.

        This endpoint is only available on managed Outpost.
      operationId: listOperatorEventDestinationTypeSchemas
      x-outpost-deployment: managed
      responses:
        "200":
          description: A list of destination type schemas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DestinationTypeSchema"
              examples:
                OperatorEventDestinationTypesExample:
                  value:
                    - type: "webhook"
                      label: "Webhook"
                      description: "Send events as webhooks (HTTP POST)."
                      icon: "<svg />"
                      config_fields:
                        - key: "url"
                          type: "text"
                          label: "Webhook URL"
                          description: "The URL to send webhook events to via HTTP POST"
                          required: true
                          pattern: "^https?:\\/\\/[^\\s]+$"
                        - key: "custom_headers"
                          type: "key_value_map"
                          label: "Custom Headers"
                          description: "Additional HTTP headers to include with every webhook request"
                          required: false
                      credential_fields: []
                    - type: "hookdeck"
                      label: "Hookdeck"
                      description: "Send events to Hookdeck Event Gateway."
                      icon: "<svg />"
                      setup_link:
                        href: "https://dashboard.hookdeck.com/connect"
                        cta: "Generate Hookdeck Token"
                      config_fields: []
                      credential_fields:
                        - key: "token"
                          type: "text"
                          label: "Hookdeck Token"
                          description: "The Hookdeck authentication token"
                          required: true
                          sensitive: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /operator-events/destinations:
    get:
      tags: [Operator Events]
      summary: List Operator Event Destinations
      description: |
        Returns every operator event destination configured for this deployment.

        The response is a plain array, not a paginated result. A project that has never had an
        operator event destination may answer 404 `tenant not found` instead of an empty array.

        This endpoint is only available on managed Outpost.
      operationId: listOperatorEventDestinations
      x-outpost-deployment: managed
      responses:
        "200":
          description: A list of operator event destinations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Destination"
              examples:
                OperatorEventDestinationsExample:
                  value:
                    - id: "des_12345"
                      type: "webhook"
                      topics:
                        ["alert.destination.disabled", "alert.destination.consecutive_failure"]
                      config:
                        url: "https://alerts.acme.com/outpost"
                      credentials:
                        secret: "whsec_abc123"
                      created_at: "2024-01-01T00:00:00Z"
                      updated_at: "2024-01-01T00:00:00Z"
                      disabled_at: null
                      target: "https://alerts.acme.com/outpost"
                    - id: "des_67890"
                      type: "hookdeck"
                      topics: ["*"]
                      config:
                        source_name: "outpost-alerts"
                        source_id: "src_xxxyyyzzz"
                      credentials:
                        token: "hd_token_..."
                      created_at: "2024-01-02T00:00:00Z"
                      updated_at: "2024-01-02T00:00:00Z"
                      disabled_at: null
                      target: "outpost-alerts"
                      target_url: "https://dashboard.hookdeck.com/sources/src_xxxyyyzzz"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Operator Events]
      summary: Create Operator Event Destination
      description: |
        Creates an operator event destination of any type listed by
        `GET /operator-events/destination-types`. `config` and `credentials` take the same fields
        as a tenant destination of that type.

        For a `webhook` destination, set `credentials.secret` to supply the signing secret. When
        it is omitted, Outpost generates one. Either way the secret is returned in `credentials`.

        Creating or changing a destination changes which topics the deployment subscribes to,
        which is why `OPERATOR_EVENTS_TOPICS` cannot be set through `PATCH /config`.

        This endpoint is only available on managed Outpost.
      operationId: createOperatorEventDestination
      x-outpost-deployment: managed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorEventDestinationCreate"
            examples:
              Webhook:
                value:
                  type: "webhook"
                  topics:
                    ["alert.destination.disabled", "alert.destination.consecutive_failure"]
                  config:
                    url: "https://alerts.acme.com/outpost"
              Hookdeck:
                value:
                  type: "hookdeck"
                  topics: ["*"]
                  config: {}
                  credentials:
                    token: "hd_token_..."
      responses:
        "200":
          description: The created operator event destination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /operator-events/destinations/{destination_id}:
    parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the operator event destination.
    get:
      tags: [Operator Events]
      summary: Get Operator Event Destination
      description: |
        Retrieves a single operator event destination.

        Returns 404 `destination not found` if no operator event destination has this ID, or
        404 `tenant not found` if the project has never had one.

        This endpoint is only available on managed Outpost.
      operationId: getOperatorEventDestination
      x-outpost-deployment: managed
      responses:
        "200":
          description: The operator event destination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags: [Operator Events]
      summary: Update Operator Event Destination
      description: |
        Updates an operator event destination. `topics` uses full-replacement semantics: the list
        sent becomes the subscription.

        `config` and `credentials` take the fields of the destination's type; fields that are not
        sent keep their value. The type itself cannot be changed.

        To change the signing secret of a `webhook` destination, set `credentials.secret`, or send
        `credentials.rotate_secret: true` to have Outpost generate a new one. On rotation the
        current secret stays valid as `previous_secret`, for 24 hours by default.

        Returns 404 `destination not found` if no operator event destination has this ID, or
        404 `tenant not found` if the project has never had one.

        This endpoint is only available on managed Outpost.
      operationId: updateOperatorEventDestination
      x-outpost-deployment: managed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorEventDestinationUpdate"
            example:
              topics:
                [
                  "alert.destination.disabled",
                  "alert.destination.consecutive_failure",
                  "alert.attempt.exhausted_retries",
                ]
      responses:
        "200":
          description: The updated operator event destination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Destination"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Operator Events]
      summary: Delete Operator Event Destination
      description: |
        Deletes an operator event destination. Deleting the last one leaves the deployment with no
        operator event delivery, and therefore silent.

        Returns 404 `destination not found` if no operator event destination has this ID, or
        404 `tenant not found` if the project has never had one.

        This endpoint is only available on managed Outpost.
      operationId: deleteOperatorEventDestination
      x-outpost-deployment: managed
      responses:
        "200":
          description: Operator event destination deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              examples:
                OperatorEventDestinationDeleted:
                  value:
                    success: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /operator-events/destinations/{destination_id}/enable:

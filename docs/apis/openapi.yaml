        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
          description: Number of items per page (1-1000, default 100). A value outside this range returns a 400.
      responses:
        "200":
          description: A paginated list of operator event delivery attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptPaginatedResult"
              examples:
                OperatorEventAttemptsListExample:
                  value:
                    pagination:
                      order_by: "time"
                      dir: "desc"
                      limit: 100
                      next: null
                      prev: null
                    models:
                      - id: "atm_12345"
                        tenant_id: "tm_12345"
                        status: "success"
                        time: "2024-01-01T00:00:05Z"
                        code: "200"
                        attempt_number: 1
                        manual: false
                        latency_ms: 11
                        event_id: "F1JKYUvykB5grOoE6Bnm6jztlF"
                        destination_id: "des_12345"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":

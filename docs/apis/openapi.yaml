  /operator-events/retry:
    post:
      tags: [Operator Events]
      summary: Retry Operator Event Delivery
      description: |
        Redelivers an operator event to one operator event destination. The event must exist, and
        the destination must be enabled, match the event's topic and filter, and already have a
        delivery attempt for the event.

        Returns 404 `event not found` if the event does not exist. Returns 404
        `destination not found` if the destination does not exist or has been deleted.

        Unlike `POST /retry`, which answers `202`, this answers `200` with `{"success": true}`.

        This endpoint is only available on managed Outpost.
      operationId: retryOperatorEvent
      x-outpost-deployment: managed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorEventRetryRequest"
            example:
              event_id: "F1JKYUvykB5grOoE6Bnm6jztlF"
              destination_id: "des_12345"
      responses:
        "200":
          description: Retry accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              examples:
                OperatorEventRetryAccepted:
                  value:
                    success: true
        "400":
          description: |
            Bad request. This can happen when:
            - The destination is disabled
            - The destination does not match the event's topic or filter
            - The event has no delivery attempt for the destination
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # Tenants
  /tenants:
    get:

  /operator-events/attempts:
    get:
      tags: [Operator Events]
      summary: List Operator Event Attempts
      description: |
        Returns the delivery attempts made to operator event destinations, newest first.

        The response holds one page of up to `limit` attempts. Paging is not available yet:
        `pagination.next` cannot be passed back.

        This endpoint is only available on managed Outpost.
      operationId: listOperatorEventAttempts
      x-outpost-deployment: managed
      parameters:
        - name: event_id
          in: query
          required: false
          schema:
            type: string
          description: Filter attempts by operator event ID.
        - name: destination_id
          in: query
          required: false
          schema:
            type: string
          description: Filter attempts by operator event destination ID.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [success, failed]
          description: Filter attempts by status.
        - name: topic
          in: query
          required: false
          schema:
            type: string
          description: Filter attempts by operator event topic.
        - name: time
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            $ref: "#/components/schemas/Operator"

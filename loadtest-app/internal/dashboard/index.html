<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outpost Load Test</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
  <div>
    <h1>Outpost Load Test</h1>
    <div class="header-info">
      <span id="outpost-url"></span>
      <span id="mock-url"></span>
    </div>
  </div>
  <div class="global-controls">
    <button class="primary" onclick="api('POST', '/api/start')">Start All</button>
    <button onclick="api('POST', '/api/stop')">Stop All</button>
    <button onclick="api('POST', '/api/reset')">Reset All</button>
  </div>
</div>

<div id="create-form">
  <h2>Create Group</h2>
  <div class="form-row">
    <label>Name<input id="f-name" value="test"></label>
    <label>Prefix<input id="f-prefix" value="lt-test"></label>
    <label>Tenants<input id="f-tenants" type="number" value="1" min="1"></label>
    <label>Dests/Tenant<input id="f-dests" type="number" value="1" min="1"></label>
    <label>Topics<input id="f-topics" value="user.created"></label>
  </div>
  <div class="form-row">
    <label>Rate/Tenant<input id="f-rate" type="number" value="50" min="1"></label>
    <label>Payload Bytes<input id="f-payload" type="number" value="512" min="64"></label>
    <label>Mock Latency (ms)<input id="f-latency" type="number" value="100"></label>
    <label>Mock Jitter (ms)<input id="f-jitter" type="number" value="20"></label>
    <label>Error Rate<input id="f-error" type="number" value="0" step="0.01" min="0" max="1"></label>
  </div>
  <div class="form-row">
    <button class="primary" onclick="createGroup()">Create</button>
  </div>
</div>

<div id="groups" class="groups"></div>

<div id="events-section">
  <div class="events-header">
    <h2>Events</h2>
    <div class="events-controls">
      <label class="group-picker">
        Group: <select id="events-group" onchange="setEventGroup(this.value)"></select>
      </label>
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all" onclick="setEventFilter('all')">All</button>
        <button class="filter-btn" data-filter="error" onclick="setEventFilter('error')">Errors</button>
        <button class="filter-btn" data-filter="missing" onclick="setEventFilter('missing')">Missing</button>
        <button class="filter-btn" data-filter="delivered" onclick="setEventFilter('delivered')">Delivered</button>
        <button class="filter-btn" data-filter="published" onclick="setEventFilter('published')">Published</button>
        <button class="filter-btn" data-filter="recovered" onclick="setEventFilter('recovered')">Recovered</button>
      </div>
      <label class="auto-refresh-toggle">
        <input type="checkbox" id="events-auto-refresh" checked onchange="toggleEventsRefresh()"> Auto-refresh
      </label>
    </div>
  </div>
  <div id="events-table-wrap">
    <table class="events-table">
      <thead>
        <tr>
          <th>Status</th>
          <th>Event ID</th>
          <th>Group</th>
          <th>Tenant</th>
          <th>Published</th>
          <th>Pub Latency</th>
          <th>E2E Latency</th>
          <th>Error</th>
        </tr>
      </thead>
      <tbody id="events-body"></tbody>
    </table>
  </div>
  <div class="events-pagination">
    <button onclick="eventsPage(-1)" id="events-prev">Prev</button>
    <span id="events-page-info">Page 1</span>
    <button onclick="eventsPage(1)" id="events-next">Next</button>
    <span id="events-total" class="events-total-count"></span>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>

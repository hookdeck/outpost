# review-gate (enforce, policy `outpost`): the review agent classifies every ready PR by a member of the
# hookdeck organization against the shared review policy in hookdeck/review-gate. When no human is
# needed (the AI review's findings are advice), or a human approval GitHub dismissed on a push carries
# over, it approves the commit; otherwise, and for anyone else's PR, one human must approve.
# Generated from hookdeck/review-gate examples/review-gate.yml (v1.8.1).
#
# pull_request_target -> posts a `review-gate` check on every commit, and keeps one live review
#                        per PR as the review agent App (a new review only when the decision
#                        changes, a new high/medium finding appears, or it approves; otherwise
#                        the live review is edited in place). Policy status `enforce`: when no
#                        human is needed (its findings don't hold that back, v1.7.0), or a human's
#                        approval GitHub dismissed on a push carries over (what changed since is
#                        nothing, nits, or needs no human on its own; v1.7.0), the review
#                        is an APPROVE for that commit; on every new commit, and on any other outcome,
#                        the agent first withdraws its earlier approvals. `shadow`: COMMENT only.
#                        pull_request_target runs this file from the base branch, so a PR can't
#                        change its own gate, and a stale test merge commit can't skip the run.
#                        Safe here because the job never checks out or runs PR code: it checks
#                        out the base commit, reads the PR diff through the API, and fetches the
#                        PR's commits only as git objects the reviewer can search and read.
#                        `edited` runs only when the base branch changed: a stacked PR that
#                        GitHub moves onto main once the PR below it merges (its branch is
#                        deleted) is reviewed then, not an hour later by the sweep.
# schedule            -> hourly sweep: reviews any ready PR whose head has no review-gate check
#                        yet (PRs open before this file existed, missed or cancelled runs) and,
#                        since v1.6.0, a source verification change reviewed before its tests had
#                        passed, once they have. It
#                        records a "human approves" check on PRs it never reviews (Dependabot,
#                        forks), so a required check doesn't strand them. With the kill switch
#                        on it withdraws every approval the agent has in force. Since v1.7.1 a
#                        head whose approval GitHub or a person dismissed is not reviewed again;
#                        when GitHub did because the merge base moved, it tells the author once
#                        to update the branch. Silent when every PR is covered.
# workflow_dispatch   -> a PR number: dry run (job summary + artifact) unless publish=true.
#                        No PR number: a sweep (publish=true to post). The App key and the Claude
#                        key live in the review-agent environment, which deploys only from the
#                        base branches (README Setup): a dispatch from any other branch fails
#                        before either is read.
name: review-gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number (leave empty to sweep every ready PR without a check)
        required: false
      publish:
        description: Post the review (true) or dry run (false)
        type: choice
        options: ['false', 'true']
        default: 'false'

permissions:
  contents: read      # GITHUB_TOKEN only checks out code; the App token does all GitHub writes.
                      # The App needs checks:write, pull-requests:write and contents:write (an App's
                      # approval counts toward required reviews only with contents:write).


jobs:
  review-gate:
    # Dependabot and fork PRs get no review (no org secrets for them; dependency changes always
    # need a human anyway). Fork PRs must stay excluded: pull_request_target would hand them secrets.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pr != '') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.draft == false &&
       (github.event.action != 'edited' || github.event.changes.base) &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45       # the review, up to 15 minutes waiting for the tests of a source verification change
                              # (v1.6.0), then for a PR with a dismissed human approval the nit check and a second
                              # review of what changed since (v1.7.0). Runs take 1 to 3 minutes as a rule.
    # The App's key can approve PRs, so it lives in an environment only the protected branches
    # can use: a workflow pushed on any other branch can't read it. pull_request_target runs in
    # the base branch's context, so it qualifies; no deployment record is created.
    environment:
      name: review-agent
      deployment: false
    concurrency:
      # one publishing run per PR at a time (a newer push or a manual publish cancels the older
      # run), so two runs can't race their approvals; a dry run never cancels the live run. A title
      # or description edit (skipped above) gets a group of its own, so it can't cancel a live run.
      group: review-gate-${{ (github.event.action == 'edited' && !github.event.changes.base) && github.run_id || ((github.event_name == 'pull_request_target' || inputs.publish == 'true') && 'publish' || 'dry') }}-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # the base commit, never the PR head: no PR code runs, and a PR cannot re-route imports
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
          # a manual run reads the full history; a PR event needs one commit
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
      # pin to the release commit: this action receives the App key and the Claude API key
      - uses: hookdeck/review-gate@f97a35f6ee9a7131a9def9f15e29cba1790e8021 # v1.8.1
        with:
          policy: outpost
          pr-number: ${{ github.event.pull_request.number || inputs.pr }}
          publish: ${{ github.event_name == 'pull_request_target' && 'true' || inputs.publish }}
          app-id: ${{ vars.REVIEW_AGENT_APP_ID }}
          app-private-key: ${{ secrets.REVIEW_AGENT_PRIVATE_KEY }}
          anthropic-api-key: ${{ secrets.REVIEW_AGENT_ANTHROPIC_API_KEY }}
          # kill switch (CTL-8): any value other than empty or 'off' (use 'human') makes every PR need
          # a human, and the next sweep withdraws every approval the agent has in force (dispatch the
          # sweep with publish=true to do it at once). Shadow vs enforce is set in the policy, not here.
          mode-override: ${{ vars.REVIEW_GATE_MODE }}

  sweep:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr == '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: review-agent
      deployment: false
    concurrency:
      group: review-gate-sweep          # scheduled and manual sweeps never overlap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: hookdeck/review-gate@f97a35f6ee9a7131a9def9f15e29cba1790e8021 # v1.8.1
        with:
          mode: sweep
          policy: outpost
          publish: ${{ github.event_name == 'schedule' && 'true' || inputs.publish }}
          app-id: ${{ vars.REVIEW_AGENT_APP_ID }}
          app-private-key: ${{ secrets.REVIEW_AGENT_PRIVATE_KEY }}
          anthropic-api-key: ${{ secrets.REVIEW_AGENT_ANTHROPIC_API_KEY }}
          mode-override: ${{ vars.REVIEW_GATE_MODE }}

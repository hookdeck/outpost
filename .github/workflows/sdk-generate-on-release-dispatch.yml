# Speakeasy opens its PR against GITHUB_REF, and a workflow can't override GITHUB_* variables. Running
# generation at the tag made Speakeasy use refs/tags/... as the PR base, which GitHub rejects (422). So
# we dispatch sdk-generate-on-release.yml on the default branch (main) and pass the tag as an input;
# that workflow checks the tag is on main before generating.
name: SDK generate on release tag — dispatch

on:
  push:
    tags:
      - "v*"

jobs:
  dispatch-generate:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch SDK generation on main for the release tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            // Prerelease and test tags (v1.9.0-rc.1, v0.0.0-sdk-gen-test) don't get SDK PRs,
            // matching update-compose-version.yml, which skips prereleases. To generate SDKs for
            // one anyway, run "SDK generate on release tag" by hand from main.
            if (tag.includes('-')) {
              core.notice(`Skipping SDK generation for prerelease/test tag ${tag}`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'sdk-generate-on-release.yml',
              // Must match the main-only check in sdk-generate-on-release.yml
              ref: 'main',
              inputs: {
                release_tag: tag
              }
            });

# Generate all three SDKs (Go, Python, TypeScript) after a version tag is created.
# Runs sequentially to avoid conflicts on the shared .speakeasy/workflow.lock. Each SDK still runs
# if the one before it failed, so one failing language doesn't skip the others.
# Uses the reusable sdk-generate-one.yml so logic lives in one place.
# See contributing/release.md and contributing/sdks.md for the release process and lock file details.
#
# Started via workflow_dispatch only. Tag pushes are handled by sdk-generate-on-release-dispatch.yml,
# which dispatches this workflow on main with the release tag as an input. It runs on main, not the
# tag, because Speakeasy opens its PR against GITHUB_REF (a tag isn't a valid PR base). The first job
# checks the tag is on main, so the generated SDKs include the release.
name: SDK generate on release tag

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v0.15.0). Run from main; the tag must be on main."
        required: true
        type: string

# Two runs at once (tags pushed close together, or a manual run during a release) would race on
# .speakeasy/workflow.lock and on Speakeasy's PR branches. Queue them instead.
concurrency:
  group: sdk-generate-on-release
  cancel-in-progress: false

jobs:
  ensure-release-tag-on-main:
    runs-on: ubuntu-latest
    steps:
      - name: Require the workflow to run on main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main (under \"Use workflow from\", choose main). Got: ${REF}"
            exit 1
          fi
      - name: Checkout main with tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require release_tag to exist and be on main
        env:
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          # Only plain version tags: rules out newlines (workflow commands) and rev syntax like ~1 or ^{}
          if ! [[ "$TAG" =~ ^v[0-9A-Za-z.+-]+$ ]]; then
            echo "::error::release_tag must look like v1.2.3 (got an invalid value)."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            echo "::error::Tag ${TAG} doesn't exist."
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/${TAG}" HEAD; then
            echo "::error::Tag ${TAG} isn't on main, so SDKs generated from main wouldn't match the release."
            exit 1
          fi
          echo "Generating SDKs from main at $(git rev-parse --short HEAD) for ${TAG} ($(git rev-parse --short "refs/tags/${TAG}^{commit}"))."

  generate-go:
    needs: ensure-release-tag-on-main
    uses: ./.github/workflows/sdk-generate-one.yml
    with:
      target: outpost-go
      force: true
      # SDK version override only when Outpost is released as v1.0.0
      set_version: ${{ github.event.inputs.release_tag == 'v1.0.0' && '1.0.0' || '' }}
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
      ci_app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  generate-python:
    # After Go (shared workflow.lock), but not skipped when Go fails
    needs: [ensure-release-tag-on-main, generate-go]
    if: ${{ !cancelled() && needs.ensure-release-tag-on-main.result == 'success' }}
    uses: ./.github/workflows/sdk-generate-one.yml
    with:
      target: outpost-python
      force: true
      set_version: ${{ github.event.inputs.release_tag == 'v1.0.0' && '1.0.0' || '' }}
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
      pypi_token: ${{ secrets.PYPI_TOKEN }}
      ci_app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  generate-ts:
    # After Python (shared workflow.lock), but not skipped when Go or Python fails
    needs: [ensure-release-tag-on-main, generate-python]
    if: ${{ !cancelled() && needs.ensure-release-tag-on-main.result == 'success' }}
    uses: ./.github/workflows/sdk-generate-one.yml
    with:
      target: outpost-ts
      force: true
      set_version: ${{ github.event.inputs.release_tag == 'v1.0.0' && '1.0.0' || '' }}
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
      npm_token: ${{ secrets.NPM_TOKEN }}
      ci_app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

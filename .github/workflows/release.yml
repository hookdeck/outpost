name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    # Declaring permissions replaces the defaults entirely, so contents: write
    # has to be listed for the GitHub release. id-token: write mints the OIDC
    # token cosign exchanges for a short-lived signing certificate.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Code checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - name: Install JS dependencies
        run: npm install
        working-directory: internal/portal
      - name: Build Portal
        run: npm run build
        working-directory: internal/portal
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # Pinned deliberately: an unpinned "latest" means every tag push builds
          # with whatever GoReleaser shipped that morning, and a breaking change
          # surfaces mid-release, after the tag exists.
          version: "v2.17.1"
          args: release -f build/.goreleaser.yaml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

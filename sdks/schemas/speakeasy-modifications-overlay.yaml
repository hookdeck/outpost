  # MCP Events operations. They are grouped under sdk.mcp and kept out of the
  # TypeScript SDK's generated MCP server (x-speakeasy-mcp.disabled): as agent
  # tools they would let any agent connected to that server subscribe arbitrary
  # principals and callback URLs with the admin key, bypassing the operator's
  # authorization. See
  # https://www.speakeasy.com/docs/standalone-mcp/customize-tools
  - target: $["paths"]["/tenants/{tenant_id}/mcp/events"]["get"]
    update:
      x-speakeasy-name-override: listEvents
      x-speakeasy-group: mcp
      x-speakeasy-mcp:
        disabled: true
    x-speakeasy-metadata:
      after: sdk.mcp.listEvents()
      before: sdk.MCP.listMCPEvents()
      type: method-name

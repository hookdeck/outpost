# Image tags live in .env.test so this stack and the containers the tests start
# themselves run the same versions. Start with `make up/test`.
#
# These are the services the default test run needs. The brokers that the
# TESTDEST=1 and TESTCOMPAT=1 test groups add live in the destination stack
# (build/dest/compose.yml, `make up/dest`).

name: "outpost-test"

services:
  test-mock:
    image: outpost-mock
    build:
      context: ../../
      dockerfile: ./build/test/Dockerfile.mock
    ports:
      - 35555:5555
  test-clickhouse:
    image: ${TEST_IMAGE_CLICKHOUSE:?run via `make up/test`, which passes --env-file .env.test}
    ports:
      - 39000:9000
  test-postgres:
    image: ${TEST_IMAGE_POSTGRES:?run via `make up/test`, which passes --env-file .env.test}
    environment:
      - POSTGRES_USER=outpost
      - POSTGRES_PASSWORD=outpost
      - POSTGRES_DB=default
    ports:
      - 35432:5432
  test-nats:
    image: ${TEST_IMAGE_NATS:?run via `make up/test`, which passes --env-file .env.test}
    command: ["-js"]
    ports:
      - 34222:4222

version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

project_name: outpost

git:
  # Ignore SDK tags when determining version
  ignore_tags:
    - 'sdks/*'

builds:
  # Orchestrator binary
  - id: outpost
    ldflags:
      - -s -w
      - -X github.com/hookdeck/outpost/internal/version.version={{.Version}}
      - -X github.com/hookdeck/outpost/internal/version.commit={{.FullCommit}}
    flags:
      - -tags=nomsgpack
    binary: outpost
    env:
      - CGO_ENABLED=0
    main: ./cmd/outpost
    goos:
      - linux
    goarch:
      - amd64
  - id: outpost-arm64
    ldflags:
      - -s -w
      - -X github.com/hookdeck/outpost/internal/version.version={{.Version}}
      - -X github.com/hookdeck/outpost/internal/version.commit={{.FullCommit}}
    flags:
      - -tags=nomsgpack
    binary: outpost
    env:
      - CGO_ENABLED=0
    main: ./cmd/outpost
    goos:
      - linux
    goarch:
      - arm64

  # Server binary
  - id: outpost-server
    ldflags:
      - -s -w
      - -X github.com/hookdeck/outpost/internal/version.version={{.Version}}
      - -X github.com/hookdeck/outpost/internal/version.commit={{.FullCommit}}
    flags:
      - -tags=nomsgpack
    binary: outpost-server
    env:
      - CGO_ENABLED=0
    main: ./cmd/outpost-server
    goos:
      - linux
    goarch:
      - amd64
  - id: outpost-server-arm64
    ldflags:
      - -s -w
      - -X github.com/hookdeck/outpost/internal/version.version={{.Version}}
      - -X github.com/hookdeck/outpost/internal/version.commit={{.FullCommit}}
    flags:
      - -tags=nomsgpack
    binary: outpost-server
    env:
      - CGO_ENABLED=0
    main: ./cmd/outpost-server
    goos:
      - linux
    goarch:
      - arm64

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

dockers_v2:
  - images:
      - "hookdeck/outpost"
    tags:
      - "{{ .Tag }}"
      - "latest"
    dockerfile: ./build/Dockerfile.goreleaser
    ids:
      - outpost
      - outpost-arm64
      - outpost-server
      - outpost-server-arm64
    extra_files:
      - build/entrypoint.sh
    platforms:
      - linux/amd64
      - linux/arm64
    # Publish SBOM and provenance attestations. Both are on by default here:
    # sbom: true adds --attest=type=sbom, and buildx attaches provenance itself
    # whenever it pushes. They ride along as extra manifest entries reported as
    # "unknown/unknown" platforms, which is how attestations are always carried —
    # Docker Hub's UI filters them out of the tag listing.
    sbom: true
    flags:
      - "--pull"
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.name: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      repository: "https://github.com/hookdeck/outpost"
      homepage: "https://hookdeck.com"

# Signs checksums.txt, which covers every archive transitively. This one runs
# before publish, so local snapshot builds pass --skip=sign to avoid needing
# cosign installed.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

# Keyless cosign signing via the workflow's OIDC token. Omitting --key is what
# selects keyless; publish-phase only, so --snapshot never invokes cosign.
docker_signs:
  - artifacts: images
    args: ["sign", "${artifact}@${digest}", "--yes"]

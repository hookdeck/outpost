version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

project_name: outpost

git:
  # Ignore SDK tags when determining version
  ignore_tags:
    - 'sdks/*'

builds:
  # Orchestrator binary
  - id: outpost
    ldflags:
      - -s -w
      - -X github.com/hookdeck/outpost/internal/version.version={{.Version}}
      - -X github.com/hookdeck/outpost/internal/version.commit={{.FullCommit}}
    binary: outpost
    env:
      - CGO_ENABLED=0
    main: ./cmd/outpost
    goos:
      - linux
    goarch:
      - amd64
  - id: outpost-arm64
    ldflags:
      - -s -w
      - -X github.com/hookdeck/outpost/internal/version.version={{.Version}}
      - -X github.com/hookdeck/outpost/internal/version.commit={{.FullCommit}}
    binary: outpost
    env:
      - CGO_ENABLED=0
    main: ./cmd/outpost
    goos:
      - linux
    goarch:
      - arm64

  # Server binary
  - id: outpost-server
    ldflags:
      - -s -w
      - -X github.com/hookdeck/outpost/internal/version.version={{.Version}}
      - -X github.com/hookdeck/outpost/internal/version.commit={{.FullCommit}}
    binary: outpost-server
    env:
      - CGO_ENABLED=0
    main: ./cmd/outpost-server
    goos:
      - linux
    goarch:
      - amd64
  - id: outpost-server-arm64
    ldflags:
      - -s -w
      - -X github.com/hookdeck/outpost/internal/version.version={{.Version}}
      - -X github.com/hookdeck/outpost/internal/version.commit={{.FullCommit}}
    binary: outpost-server
    env:
      - CGO_ENABLED=0
    main: ./cmd/outpost-server
    goos:
      - linux
    goarch:
      - arm64

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

dockers_v2:
  - images:
      - "hookdeck/outpost"
    tags:
      - "{{ .Tag }}"
      - "latest"
    dockerfile: ./build/Dockerfile.goreleaser
    ids:
      - outpost
      - outpost-arm64
      - outpost-server
      - outpost-server-arm64
    extra_files:
      - build/entrypoint.sh
    platforms:
      - linux/amd64
      - linux/arm64
    # No attestations, so the manifest keeps the same two platform entries as
    # today. Takes both switches — buildx adds provenance on its own.
    sbom: false
    flags:
      - "--pull"
      - "--provenance=false"
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.name: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      repository: "https://github.com/hookdeck/outpost"
      homepage: "https://hookdeck.com"
